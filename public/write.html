<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Write · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Hands">
</head>
<body><div id="nav"></div><div class="wrap">
<h1>✍️ Write</h1>
<div id="taskinfo"></div>
<div class="card">
  <label>Writing type</label>
  <select id="type">
    <option value="story">📖 Story</option>
    <option value="diary">📔 Diary Writing</option>
    <option value="letter">💌 Letter Writing</option>
    <option value="poem">🎵 Poem Writing</option>
    <option value="manifesto">📜 Manifesto Writing</option>
    <option value="review">⭐ Book Review</option>
    <option value="anything">✨ Write Anything</option>
  </select>
  <label>Language</label>
  <select id="lang">
    <option>English</option><option>Malayalam</option><option>Arabic</option><option>Urdu</option><option>Kannada</option><option>Manglish</option>
  </select>
  <label>Title</label><input id="title" placeholder="Give your piece a lovely title">
  <label>Your writing</label><textarea id="content" placeholder="Once upon a time…"></textarea>
  <button class="btn" id="submit">Submit for approval 📮</button>
  <p class="muted" style="font-size:.85rem">Your teacher reads everything before it is published. ⭐</p>
</div>
<div class="card"><h2>📚 My submissions</h2><div id="mine"></div></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Islamic Academy · S1 — 12th Batch</div>
</div>
<script>
(async () => {
  const user = await guard("student"); if (!user) return;
  document.getElementById("nav").innerHTML = studentNav("write.html");
  const params = new URLSearchParams(location.search);
  const taskId = params.get("task");
  if (taskId) {
    try {
      const t = await api("GET", "/api/weekly-tasks");
      const all = [t.current, ...(t.archive || [])].filter(Boolean);
      const task = all.find(x => String(x.id) === String(taskId));
      if (task && task.kind !== "quiz") {
        document.getElementById("taskinfo").innerHTML =
          `<div class="alert"><b>📅 Weekly task: ${esc(task.title)}</b><br>${esc(task.prompt)}</div>`;
        if (task.kind === "story_start") document.getElementById("content").value = task.prompt + "\n\n";
      }
    } catch (e) {}
  }
  // Guided template for book reviews (only fills an empty box)
  const TEMPLATES = {
    review: "Book name: \nAuthor: \nWhat the book is about: \nWhat I liked most: \nMy rating (1-5 stars): \n\nMy review:\n"
  };
  document.getElementById("type").addEventListener("change", e => {
    const t = TEMPLATES[e.target.value];
    const c = document.getElementById("content");
    if (t && !c.value.trim()) c.value = t;
  });
  async function loadMine() {
    const m = await api("GET", "/api/my/works");
    const badge = s => s === "approved" ? "✅ Published" : s === "rejected" ? "❌ Not approved" : "⏳ Waiting for teacher";
    document.getElementById("mine").innerHTML = m.works.length ? m.works.map(w =>
      `<div class="storycard"><h3>${esc(w.title)}</h3>
       <p><span class="tag type">${esc(w.type)}</span><span class="tag lang">${esc(w.language)}</span> ${badge(w.status)}
       ${w.stars ? ` <span class="pill">⭐ ${w.stars}</span>` : ""}</p>
       <p class="muted" style="font-size:.8rem">${fmtDate(w.created_at)}</p>
       ${w.status === "approved" ? `<p class="muted" style="font-size:.85rem">🔒 Published works can't be changed. Ask your teacher for help.</p>` : ""}</div>`).join("")
      : `<p class="muted">Nothing written yet — your first story is waiting! ✍️</p>`;
  }
  await loadMine();
  document.getElementById("submit").onclick = async () => {
    try {
      await api("POST", "/api/works", {
        type: document.getElementById("type").value,
        language: document.getElementById("lang").value,
        title: document.getElementById("title").value,
        content: document.getElementById("content").value,
        weekly_task_id: taskId || null,
      });
      toast("Submitted! Your teacher will read it soon. ⭐");
      document.getElementById("title").value = ""; document.getElementById("content").value = "";
      await loadMine();
    } catch (e) { toast(e.message, false); }
  };
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body></html>
