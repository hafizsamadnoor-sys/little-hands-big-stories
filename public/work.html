<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Read · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Hands">
<style>
.poemposter{max-width:640px;margin:16px auto;background:#ffffff;border:3px solid #0b3c46;border-radius:12px;padding:38px 34px;text-align:center;box-shadow:0 6px 24px rgba(11,60,70,.15);position:relative}
.poemposter::before{content:"";position:absolute;inset:8px;border:1.5px solid #b45309;border-radius:8px;pointer-events:none}
.pp-inst{font-size:.72rem;font-weight:700;letter-spacing:2.5px;color:#0e7c8c;text-transform:uppercase}
.pp-kind{display:inline-block;margin-top:12px;background:#0b3c46;color:#fff;font-size:.8rem;font-weight:700;padding:4px 14px;border-radius:999px}
.pp-title{font-family:Georgia,serif;font-size:1.9rem;font-weight:700;color:#0b3c46;margin:14px 0 4px;line-height:1.3}
.pp-div{color:#b45309;letter-spacing:6px;margin:6px 0 14px}
.pp-body{white-space:pre-wrap;font-size:1.12rem;line-height:2;color:#263238;font-family:Georgia,serif}
.pp-author{margin-top:20px;font-family:Georgia,serif;font-style:italic;font-size:1.05rem;color:#0b3c46}
.pp-foot{margin-top:16px;padding-top:12px;border-top:1px dashed #b45309;font-size:.78rem;color:#64748b;letter-spacing:.5px}
.pp-app{margin-top:8px;font-size:.72rem;color:#94a3b8;line-height:1.6}
</style>
</head>
<body><div id="nav"></div><div class="wrap">
<div id="story"></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Islamic Academy · S1 — 12th Batch</div>
</div>
<script>
(async () => {
  const user = await guard(); if (!user) return;
  document.getElementById("nav").innerHTML = user.role === "teacher" ? teacherNav("") : studentNav("");
  const id = new URLSearchParams(location.search).get("id");
  const d = await api("GET", "/api/work/" + id);
  const w = d.work;
  document.getElementById("story").innerHTML = `
    ${w.featured ? `<p><span class="pill">🌟 Featured Story</span></p>` : ""}
    <h1>${esc(w.title)}</h1>
    <p><span class="tag type">${esc(w.type)}</span><span class="tag lang">${esc(w.language)}</span>
    ${w.stars ? `<span class="pill">⭐ ${w.stars} stars</span>` : ""}</p>
    <p class="muted">by <b>${esc(w.author)}</b> · ${fmtDate(w.created_at)} · 👁️ ${d.reads} reads</p>
    <div class="card" style="font-size:1.08rem; white-space:pre-wrap">${esc(w.content)}</div>
    <p>${user.role === "student" && !d.isOwner
      ? `<button class="btn ${d.liked ? "ghost" : ""}" id="like">${d.liked ? "💔 Unlike" : "❤️ Like"} (${d.likes})</button>`
      : `<span class="muted">❤️ ${d.likes} likes</span>`}
      <a class="btn ghost" href="/works.html">← All stories</a></p>
    ${d.isOwner && w.status === "approved" ? `<div class="alert">🔒 This work is published and locked. Only your teacher can change it.</div>` : ""}
    ${w.type === "poem" && w.status === "approved" ? `
    <h2 style="margin-top:30px">🖼️ Poem Poster</h2>
    <p class="muted">This poster is made automatically from the published poem — anyone can read it here, and you can download it as a picture to share or print.</p>
    <div id="poster" class="poemposter">
      <div class="pp-inst">Noorul Huda Centre for Excellence</div>
      <div><span class="pp-kind">🎭 Poem</span></div>
      <div class="pp-title">${esc(w.title)}</div>
      <div class="pp-div">✿ ✿ ✿</div>
      <div class="pp-body"${w.language === "Arabic" || w.language === "Urdu" ? ` dir="rtl"` : ""}>${esc(w.content)}</div>
      <div class="pp-author">— ${esc(w.author)}</div>
      <div class="pp-foot">🌼 Little Hands, Big Stories · S1 — 12th Batch 🌼</div>
      <div class="pp-app">📱 <b>Little Hands, Big Stories</b> — our young writers' app, where the S1 boys write, publish &amp; shine.<br>Read more poems &amp; stories: littlehandsbigstories.blogspot.com</div>
    </div>
    <p style="margin-top:12px"><button class="btn" id="posterbtn">⬇️ Download Poster (PNG)</button></p>` : ""}`;
  const lb = document.getElementById("like");
  if (lb) lb.onclick = async () => {
    const r = await api("POST", "/api/work/" + id + "/like");
    lb.textContent = (r.liked ? "💔 Unlike" : "❤️ Like") + ` (${d.likes + (r.liked ? 1 : -1)})`;
    d.likes += r.liked ? 1 : -1;
  };
  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  function showSaveOverlay(dataUrl) {
    let ov = document.getElementById("saveOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "saveOverlay";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(2,20,26,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
      ov.innerHTML = `<div style="color:#fff;font-weight:700;text-align:center">📥 Your poster is ready!<br><span style="font-weight:400;font-size:.85rem">Press &amp; hold the image, then tap “Save to Photos”</span></div><img id="saveOverlayImg" style="max-width:94vw;max-height:74vh;border-radius:8px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)"><button class="btn" id="saveOverlayClose">✖ Close</button>`;
      document.body.appendChild(ov);
      ov.querySelector("#saveOverlayClose").onclick = () => { ov.style.display = "none"; };
    }
    ov.querySelector("#saveOverlayImg").src = dataUrl;
    ov.style.display = "flex";
  }
  const pb = document.getElementById("posterbtn");
  if (pb) pb.onclick = async () => {
    const old = pb.textContent;
    pb.disabled = true; pb.textContent = "⏳ Making poster…";
    try {
      await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
      const src = await html2canvas(document.getElementById("poster"), { scale: 3, backgroundColor: "#ffffff", useCORS: true });
      // Compose onto an exact A4 page (2480 x 3508 px = A4 at 300 dpi), poster centred with margins
      const A4W = 2480, A4H = 3508, M = 120;
      const out = document.createElement("canvas");
      out.width = A4W; out.height = A4H;
      const ctx = out.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, A4W, A4H);
      const sc = Math.min((A4W - 2 * M) / src.width, (A4H - 2 * M) / src.height);
      const dw = Math.round(src.width * sc), dh = Math.round(src.height * sc);
      ctx.drawImage(src, Math.round((A4W - dw) / 2), Math.round((A4H - dh) / 2), dw, dh);
      const blob = await new Promise(r => out.toBlob(r, "image/png"));
      const fname = "Poem-Poster-" + (w.title || "Poem").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") + ".png";
      let delivered = false;
      try {
        const res = await fetch("/api/save-file", { method: "POST", headers: { "Content-Type": "image/png", "X-Filename": fname }, body: blob });
        const d = await res.json();
        if (d && d.url) { delivered = true; location.href = d.url; }
      } catch (e) { /* fall through to the fallback below */ }
      if (!delivered) {
        const u = URL.createObjectURL(blob);
        const isAppleTouch = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
        if (isAppleTouch) { showSaveOverlay(u); }
        else {
          const a = document.createElement("a");
          a.download = fname;
          a.href = u;
          a.click();
          setTimeout(() => URL.revokeObjectURL(u), 30000);
        }
      }
    } catch (e) { alert("Could not make the poster. Please check your internet and try again."); }
    pb.disabled = false; pb.textContent = old;
  };
  if (location.hash === "#poster") { const p = document.getElementById("poster"); if (p) p.scrollIntoView(); }
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body></html>
