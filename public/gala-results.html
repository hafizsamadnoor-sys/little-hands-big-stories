<body><div id="nav"></div><div class="gwrap" id="gwrap">
<div id="pagehead"></div>
<div id="content"><p class="muted" style="text-align:center;padding:30px 0">Loading Gala results… 🎉</p></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Centre for Excellence · S1 — 12th Batch<br>Powered by NSU — Noorul Huda Students Union</div>
</div>
<canvas id="confetti" style="display:none"></canvas>
<script>
// ── Twelfth Gala Results (Samad, 13 Nov 2026) ────────────────────────
// Public (logged-in) results: every boy's Gala points, team battle, and
// three downloadable posters (Day / Overall / Team) drawn from live scores.
// Reads /api/gala/results — Gala points only, never the writing Points
// Board, clubs or certificates.
const LEADERS = { Door: { leader: "511", asst: "518" }, Window: { leader: "526", asst: "514" } };
const DAY1_UTC = Date.UTC(2026, 10, 12); // Day 1 = Thu 12 Nov 2026
let DATA = null, cardBoyId = null, filterTeam = "All", searchQ = "";
const dayDate = (n) => new Date(DAY1_UTC + (n - 1) * 86400000);
const fmtDay = (n) => dayDate(n).toLocaleDateString("en-GB", { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" });
const scored = (b) => b.days.some(v => v !== null);
const ordinal = (n) => n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th";
const medal = (r) => r === 1 ? "🥇" : r === 2 ? "🥈" : r === 3 ? "🥉" : "";
// Competition ranking: 1 + boys with strictly more points (ties share a
// rank, the next number is skipped: 1, 2, 2, 4).
function rankOf(b) {
  if (!scored(b)) return null;
  return 1 + DATA.players.filter(x => scored(x) && x.total > b.total).length;
}
function roleOf(b) {
  const L = LEADERS[b.team] || {};
  if (b.ad_no === L.leader) return "Leader";
  if (b.ad_no === L.asst) return "Asst. Leader";
  return "";
}
function rankLabel(rank, count) {
  if (rank === 1) return count > 1 ? "Joint 1st Place 🥇" : "1st Place 🥇";
  if (rank === 2) return count > 1 ? "Joint 2nd Place 🥈" : "2nd Place 🥈";
  if (rank === 3) return count > 1 ? "Joint 3rd Place 🥉" : "3rd Place 🥉";
  return ordinal(rank) + " Place";
}
// Top 3 rank groups (distinct point totals, highest first), each with its
// boys — generalises to any tie pattern.
function podiumGroups() {
  const groups = {};
  DATA.players.filter(scored).forEach(b => { (groups[b.total] = groups[b.total] || []).push(b); });
  return Object.keys(groups).map(Number).sort((a, b) => b - a).slice(0, 3).map((total, i) => ({
    total, rank: i + 1,
    boys: groups[total].sort((a, b) => a.display_name.localeCompare(b.display_name)),
  }));
}
function latestDay() {
  let d = 0;
  DATA.players.forEach(b => b.days.forEach((v, i) => { if (v !== null && i + 1 > d) d = i + 1; }));
  return d || 1;
}
function dayPoints(b, day) { return b.days[day - 1]; }

function celebrate() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti");
  cv.style.display = "block";
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext("2d");
  const cols = ["#0b4f63", "#c9920e", "#f5c542", "#d97c2b", "#16a34a", "#e11d48"];
  const ps = Array.from({ length: 70 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.3,
    w: 6 + Math.random() * 8, h: 8 + Math.random() * 8, c: cols[Math.floor(Math.random() * cols.length)],
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, r: Math.random() * Math.PI, vr: -0.08 + Math.random() * 0.16,
    life: 2.2 + Math.random() * 1.8,
  }));
  const t0 = performance.now();
  (function tick(t) {
    const el = (t - t0) / 1000;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (el < 4.2) requestAnimationFrame(tick);
    else { ctx.clearRect(0, 0, cv.width, cv.height); cv.style.display = "none"; }
  })(t0);
}

function teamBattleHtml() {
  const tt = DATA.teamTotals || { Door: 0, Window: 0 };
  const max = Math.max(tt.Door, tt.Window, 1);
  const ld = latestDay();
  const prog = (DATA.programs || [])[ld - 1] || {};
  const unscoredN = DATA.players.filter(b => !scored(b)).length;
  const order = ["Door", "Window"].sort((a, b) => tt[b] - tt[a]);
  const cards = order.map((t, i) => {
    const teamBoys = DATA.players.filter(b => b.team === t);
    const scoredBoys = teamBoys.filter(scored);
    const dayPts = teamBoys.reduce((a, b) => a + (dayPoints(b, ld) || 0), 0);
    const L = LEADERS[t];
    const leader = teamBoys.find(b => b.ad_no === L.leader);
    const asst = teamBoys.find(b => b.ad_no === L.asst);
    const col = t === "Door" ? "#0b6a86" : "#d97c2b";
    const bar = (label, val) => `<div class="gbar"><div class="glab"><span>${esc(label)}</span><span>${val} pts</span></div>
      <div class="track"><div class="fill" style="width:${Math.round(val / max * 100)}%;background:${col}"></div></div></div>`;
    return `<div class="gteam ${t === "Door" ? "door" : "win"}">
      <h3>${t === "Door" ? "🚪" : "🪟"} Team ${t}</h3>
      <span class="gplace ${i === 0 ? "" : "second"}">${i === 0 ? "🥇 1st Place" : "🥈 2nd Place"}</span>
      <div style="font-size:.8rem;color:#5b6b76;margin-top:6px">Leader: ${leader ? esc(leader.display_name) : "—"} · Asst: ${asst ? esc(asst.display_name) : "—"} · 14 boys</div>
      <div class="big">${tt[t]} pts</div>
      ${bar("Day " + ld + " · " + (prog.name || ""), dayPts)}
      ${bar("Total", tt[t])}
      <div style="font-size:.82rem;color:#5b6b76">Scored: ${scoredBoys.length ? scoredBoys.map(b => esc(b.display_name) + " " + b.total).join(", ") : "— yet"}</div>
    </div>`;
  }).join("");
  let lead;
  if (tt.Door === tt.Window && tt.Door === 0) lead = "⏳ No scores yet — Day 1 begins the battle!";
  else if (tt.Door === tt.Window) lead = `🤝 Teams are tied at ${tt.Door} points${unscoredN ? ` — with ${unscoredN} boy${unscoredN === 1 ? "" : "s"} still to be scored, anything can change! 🚀` : " — what a finish!"}`;
  else {
    const win = tt.Window > tt.Door ? "Window" : "Door", lose = win === "Window" ? "Door" : "Window";
    lead = `🎉 Team ${win} leads by ${Math.abs(tt.Window - tt.Door)} points (${tt[win]} – ${tt[lose]})${unscoredN ? ` — with ${unscoredN} boy${unscoredN === 1 ? "" : "s"} still to be scored, anything can change! 🚀` : ""}`;
  }
  return `<h2>⚔️ Team Battle — Door vs Window</h2><div class="gbattle">${cards}</div><div class="glead">${lead}</div>`;
}

function scoreCardHtml(b) {
  if (!b) return `<div class="card"><h3>⭐ Score Card</h3><p class="muted">No scores yet — the first results will appear here after Day 1. 🎉</p></div>`;
  const r = rankOf(b);
  const ld = latestDay();
  const prog = (DATA.programs || [])[ld - 1] || {};
  const role = roleOf(b);
  const doneDays = (DATA.dayTotals || []).filter(d => d.done);
  const rows = doneDays.map(d => `<tr><td>Day ${d.day}</td><td>${esc(d.program)}</td><td><b>${b.days[d.day - 1] === null ? "–" : b.days[d.day - 1]}</b></td></tr>`).join("");
  return `<div class="card"><h3>⭐ Score Card</h3>
    <div class="gcard-row"><span class="gphoto">${avatar(b.display_name, b.photo)}</span>
    <div><div style="font-size:1.25rem;font-weight:800">${esc(b.display_name)} ${medal(r || 0)}</div>

// ── Downloadable Gala posters (Samad, 15 Nov 2026) ──────────────────
// Three poster types, matching the approved A4 designs, always drawn
// from the LIVE scores: Day posters (Top 3 of that day), Overall
// Scoreboard (Top 3 overall + Top 10), Team Scoreboard (both teams).
let posterDay = null; // selected day for the Day poster
const TEAM_GREEN = "#16a34a", TEAM_BLUE = "#2563eb";
const RANK_BD = { 1: "#d4a017", 2: "#94a3b8", 3: "#d97706" };
const RANK_TX = { 1: "#92400e", 2: "#475569", 3: "#9a3412" };

// Tie-aware groups for ONE day: [{ total (that day's points), rank, boys }]
function dayGroups(day) {
  const groups = {};
  DATA.players.filter(b => b.days[day - 1] !== null).forEach(b => { (groups[b.days[day - 1]] = groups[b.days[day - 1]] || []).push(b); });
  return Object.keys(groups).map(Number).sort((a, b) => b - a).slice(0, 3).map((total, i) => ({
    total, rank: i + 1,
    boys: groups[total].sort((a, b) => a.display_name.localeCompare(b.display_name)),
  }));
}
// Top 10 overall — dense ranks like the approved poster (1, 2, 2, 3, 4, 4:
// rank = 1 + distinct higher totals). Ties are ordered by who scored first
// (earliest scored day), then name. Ties at the cutoff are all included.
function top10Rows() {
  const firstDay = (b) => { const i = b.days.findIndex(v => v !== null); return i === -1 ? 99 : i; };
  const sb = DATA.players.filter(scored).sort((a, b) => b.total - a.total || firstDay(a) - firstDay(b) || a.display_name.localeCompare(b.display_name));
  let rows = sb.slice(0, 10);
  if (sb.length > 10) rows = sb.filter(b => b.total >= sb[9].total);
  const distinctAbove = (total) => new Set(sb.filter(x => x.total > total).map(x => x.total)).size;
  return rows.map(b => ({ rank: 1 + distinctAbove(b.total), boy: b }));
}
// Day status from the live data + today's date in IST.
function istTodayIdx() {
  const p = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" }).split("-").map(Number);
  return Math.floor((Date.UTC(p[0], p[1] - 1, p[2]) - DAY1_UTC) / 86400000) + 1;
}
function dayStatus(day) {
  const dt = (DATA.dayTotals || [])[day - 1];
  if (dt && dt.done) return "done";
  const t = istTodayIdx();
  if (day === t) return "today";
  if (day < t) return "not-entered";
  return "future";
}
function afterLine() {
  const n = DATA.daysDone || 0;
  return "AFTER " + n + (n === 1 ? " PROGRAM" : " PROGRAMS");
}
function playedNamesLine() {
  return (DATA.programs || []).slice(0, DATA.daysDone || 0).map((p, i) => "Day " + (i + 1) + ": " + p.name).join("  •  ");
}
function topScorerOf(team) {
  return [...DATA.players].filter(b => b.team === team && scored(b)).sort((a, b) => b.total - a.total || a.display_name.localeCompare(b.display_name))[0] || null;
}
function boyTotalNote(b) {
  return (DATA.dayTotals || []).filter(d => d.done && b.days[d.day - 1] !== null).map(d => "Day " + d.day + ": " + b.days[d.day - 1]).join("  •  ");
}

// Podium: 2nd card left, 1st centre, 3rd right. groups = [{ rank, boys }];
// ptsFn gives the points to show per boy, noteFn the small line under it.
function podiumHtml(groups, ptsFn, noteFn) {
  const slot = (g) => {
    if (!g) return `<div></div>`;
    const rank = g.rank, tx = RANK_TX[rank];
    const label = g.boys.length > 1 ? "Joint " + ordinal(rank) + " Place" : ordinal(rank) + " Place";
    const boyHtml = (b) => `<div><span class="pphoto" style="border-color:${b.team === "Window" ? TEAM_GREEN : TEAM_BLUE}">${avatar(b.display_name, b.photo)}</span>

    const inner = g.boys.length > 1 ? `<div class="pjoint">${g.boys.map(boyHtml).join("")}</div>` : boyHtml(g.boys[0]);
    return `<div class="pcard r${rank}${rank === 1 ? " centre" : ""}"><div class="rbadge" style="background:${RANK_BD[rank]}">${rank}</div>
      <div class="rlabel" style="color:${tx}">${label.toUpperCase()}</div>${inner}</div>`;

// ── PNG download: redraw the poster fresh on a 1240×1640 canvas ──────
function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null); im.src = src;
  });
}
function fitFont(ctx, text, maxW, font, minPx) {
  const m = font.match(/^(.*?)\s*(\d+)px\s+(.*)$/);
  const pre = m ? m[1].trim() : "";
  let px = m ? parseInt(m[2], 10) : 16;
  const fam = m ? m[3] : "Verdana";
  const mk = (p) => (pre ? pre + " " : "") + p + "px " + fam;
  ctx.font = mk(px);
  while (px > minPx && ctx.measureText(text).width > maxW) { px -= 2; ctx.font = mk(px); }
  return ctx.font;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawPhotoCircle(ctx, img, name, cx, cy, r, ring) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
  if (img) {
    const sq = Math.min(img.width, img.height);
    ctx.drawImage(img, (img.width - sq) / 2, (img.height - sq) / 2, sq, sq, cx - r, cy - r, r * 2, r * 2);
  } else {
    ctx.fillStyle = "#e0f2f7"; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.fillStyle = "#0b3c46"; ctx.font = "bold " + Math.round(r * 0.9) + "px Verdana"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText((name || "?").trim()[0] || "?", cx, cy + 2);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 7; ctx.strokeStyle = ring; ctx.stroke();
}

// ── PNG downloads: redraw each poster fresh on a 1240×1754 (A4) canvas ─
function canvasPoster() {
  const cv = document.createElement("canvas");
  cv.width = 1240; cv.height = 1754;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 1240, 1754);
  return [cv, ctx];
}
function setDlBusy(btn, busy, label) {
  if (!btn) return;
  btn.disabled = busy;
  btn.textContent = busy ? "⏳ Making your poster…" : label;
}
function saveCanvasPng(cv, filename) {
  const a = document.createElement("a");
  a.href = cv.toDataURL("image/png");
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
// Teal band header (flower tile + institution + batch line + gold rule).
async function drawBand(ctx) {
  ctx.fillStyle = "#0b4f63"; ctx.fillRect(0, 0, 1240, 300);
  ctx.fillStyle = "#d4a017"; ctx.fillRect(0, 300, 1240, 6);
  const fl = await loadImg("/icons/flower-192.png");
  ctx.save();
  roundRect(ctx, 592, 52, 56, 56, 16); ctx.clip();
  if (fl) ctx.drawImage(fl, 592, 52, 56, 56);
  else { ctx.fillStyle = "#bfe8ef"; ctx.fillRect(592, 52, 56, 56); }
  ctx.restore();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 40px Verdana";
  ctx.fillText("LITTLE HANDS, BIG STORIES", 620, 122);
  ctx.fillStyle = "#cfe8ec"; ctx.font = "30px Verdana";
  ctx.fillText("Noorul Huda Centre for Excellence, Madannoor", 620, 174);
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 30px Verdana";
  ctx.fillText("Twelfth Batch  •  Secondary First Year  •  S1", 620, 214);
}
async function drawLogo(ctx, y) {
  const lg = await loadImg("/gala-logo.jpg");
  if (!lg) return y;
  const lw = 520, lh = Math.round(lw * lg.height / lg.width);
  ctx.drawImage(lg, (1240 - lw) / 2, y, lw, lh);
  return y + lh;
}
function drawFoot(ctx) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#0e7d9c"; ctx.font = "bold 38px Verdana";
  ctx.fillText("Powered by NSU", 620, 1600);
  ctx.fillStyle = "#475569"; ctx.font = "29px Verdana";
  ctx.fillText("Noorul Huda Students Union", 620, 1652);
}
// Green/blue split battle bar (Window left, Door right).
function drawBattleBar(ctx, y, wPts, dPts) {
  const x = 80, w = 1080, h = 46;
  ctx.save();
  roundRect(ctx, x, y, w, h, 23); ctx.clip();
  const tot = wPts + dPts;
  const wf = tot ? Math.round(w * wPts / tot) : Math.round(w / 2);
  ctx.fillStyle = "#16a34a"; ctx.fillRect(x, y, wf, h);
  ctx.fillStyle = "#2563eb"; ctx.fillRect(x + wf, y, w - wf, h);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(x + wf - 2, y, 4, h);
  ctx.restore();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 24px Verdana";
  ctx.fillText("Window " + wPts, x + wf / 2, y + h / 2);
  ctx.fillText("Door " + dPts, x + wf + (w - wf) / 2, y + h / 2);
  return y + h;
}
// One podium card (1 boy, or 2 tied boys side by side in one card).
async function drawPodiumCard(ctx, x, y, w, h, rank, boys, fill, noteFn, ptsFn) {
  const badge = RANK_BD[rank], txcol = RANK_TX[rank];
  ctx.fillStyle = fill; ctx.strokeStyle = badge; ctx.lineWidth = 4;
  roundRect(ctx, x, y, w, h, 16); ctx.fill(); ctx.stroke();
  const cx = x + w / 2;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.beginPath(); ctx.arc(cx, y + 42, 30, 0, Math.PI * 2); ctx.fillStyle = badge; ctx.fill();
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 32px Verdana";
  ctx.fillText(String(rank), cx, y + 44);
  const label = boys.length > 1 ? "JOINT " + ordinal(rank).toUpperCase() + " PLACE" : ordinal(rank).toUpperCase() + " PLACE";
  ctx.fillStyle = txcol; ctx.font = "bold 20px Verdana";
  ctx.fillText(label, cx, y + 84);
  const top = y + 104;
  if (boys.length === 1) {
    const b = boys[0];
    const psz = Math.min(210, h - 300);
    const img = await loadImg(b.photo);
    drawPhotoCircle(ctx, img, b.display_name, cx, top + psz / 2 + 5, psz / 2, b.team === "Window" ? TEAM_GREEN : TEAM_BLUE);
    let ny = top + psz + 12;
    ctx.fillStyle = "#111111";
    ctx.font = fitFont(ctx, b.display_name.toUpperCase(), w - 30, "bold 34px Verdana", 18);
    ctx.fillText(b.display_name.toUpperCase(), cx, ny + 17);
    ny += 40;
    ctx.fillStyle = b.team === "Window" ? TEAM_GREEN : TEAM_BLUE; ctx.font = "bold 23px Verdana";
    ctx.fillText("Team " + b.team, cx, ny + 12);
    ny += 34;
    ctx.fillStyle = txcol; ctx.font = "bold 52px Verdana";
    ctx.fillText(ptsFn(b) + " pts", cx, ny + 26);
    ny += 54;
    ctx.fillStyle = "#475569"; ctx.font = "21px Verdana";
    ctx.fillText(noteFn(b), cx, ny + 11);
  } else {
    const bw = w / 2;
    for (let i = 0; i < boys.length; i++) {
      const b = boys[i];
      const ccx = x + bw * i + bw / 2;
      const img = await loadImg(b.photo);
      drawPhotoCircle(ctx, img, b.display_name, ccx, top + 60, 55, b.team === "Window" ? TEAM_GREEN : TEAM_BLUE);
      let ny = top + 122;
      ctx.fillStyle = "#111111";
      ctx.font = fitFont(ctx, b.display_name.toUpperCase(), bw - 16, "bold 26px Verdana", 16);
      ctx.fillText(b.display_name.toUpperCase(), ccx, ny + 13);
      ny += 34;
      ctx.fillStyle = b.team === "Window" ? TEAM_GREEN : TEAM_BLUE; ctx.font = "bold 20px Verdana";
      ctx.fillText("Team " + b.team, ccx, ny + 10);
      ny += 28;
      ctx.fillStyle = txcol; ctx.font = "bold 38px Verdana";
      ctx.fillText(ptsFn(b) + " pts", ccx, ny + 19);
      ny += 40;
      ctx.fillStyle = "#475569"; ctx.font = "18px Verdana";
      ctx.fillText(noteFn(b), ccx, ny + 9);
    }
  }
}
// Podium: 2nd left, 1st centre (taller), 3rd right. Returns bottom y.
async function drawPodium(ctx, groups, y, noteFn, ptsFn, centreH) {
  const h = centreH || 550, sh = h - 80;
  const cw = 360, gap = 20;
  const x0 = (1240 - (3 * cw + 2 * gap)) / 2;
  const base = y + 80;
  if (groups[1]) await drawPodiumCard(ctx, x0, base, cw, sh, groups[1].rank, groups[1].boys, "#f1f5f9", noteFn, ptsFn);
  if (groups[0]) await drawPodiumCard(ctx, x0 + cw + gap, y, cw, h, groups[0].rank, groups[0].boys, "#fef3c7", noteFn, ptsFn);
  if (groups[2]) await drawPodiumCard(ctx, x0 + 2 * (cw + gap), base, cw, sh, groups[2].rank, groups[2].boys, "#ffedd5", noteFn, ptsFn);
  return y + h;
}
// Top 10 list (single column; rows shrink so 10 rows still fit above the footer).
function drawTop10(ctx, rows, y, maxY) {
  const avail = maxY - y;
  const ROW_H = rows.length ? Math.min(52, Math.floor(avail / rows.length)) : 52;
  const fs = ROW_H >= 46 ? 22 : 19;
  const colX = 210, colW = 820;
  rows.forEach((r, i) => {
    const yy = y + i * ROW_H;
    if (i % 2 === 0) { ctx.fillStyle = "#f1f5f9"; roundRect(ctx, colX, yy, colW, ROW_H - 4, 10); ctx.fill(); }
    ctx.textBaseline = "middle";
    ctx.textAlign = "left"; ctx.fillStyle = "#0b4f63"; ctx.font = "bold " + fs + "px Verdana";
    ctx.fillText(String(r.rank), colX + 16, yy + ROW_H / 2);
    ctx.fillStyle = "#111111";
    ctx.font = fitFont(ctx, r.boy.display_name, colW - 240, "bold " + fs + "px Verdana", 15);
    ctx.fillText(r.boy.display_name, colX + 64, yy + ROW_H / 2);
    ctx.textAlign = "right"; ctx.fillStyle = "#64748b"; ctx.font = (fs - 3) + "px Verdana";
    ctx.fillText("Team " + r.boy.team, colX + colW - 110, yy + ROW_H / 2);
    ctx.fillStyle = "#111111"; ctx.font = "bold " + fs + "px Verdana";
    ctx.fillText(r.boy.total + " pts", colX + colW - 16, yy + ROW_H / 2);
  });
  return y + rows.length * ROW_H;
}
// "Day 1: X • Day 2: Y" line, wrapped to fit the page width.
function drawPlayedNames(ctx, y) {
  const parts = (DATA.programs || []).slice(0, DATA.daysDone || 0).map((p, i) => "Day " + (i + 1) + ": " + p.name);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#475569"; ctx.font = "27px Verdana";
  if (!parts.length) { ctx.fillText("No program played yet", 620, y + 14); return y + 52; }
  const lines = [];
  let cur = "";
  for (const p of parts) {
    const next = cur ? cur + "  •  " + p : p;
    if (ctx.measureText(next).width <= 1120) cur = next;
    else { lines.push(cur); cur = p; }
  }
  if (cur) lines.push(cur);
  lines.forEach((ln, i) => ctx.fillText(ln, 620, y + 14 + i * 34));
  return y + 18 + lines.length * 34;
}
async function downloadDayPoster(day) {

    let y = await drawLogo(ctx, 330); y += 26;

    ctx.fillStyle = "#475569"; ctx.font = "28px Verdana";
    ctx.fillText("Day " + day + "  •  " + fmtDay(day) + "  •  Twelfth Gala", 620, y + 14); y += 56;

      const groups = dayGroups(day);

      ctx.fillStyle = "#111111"; ctx.font = "bold 26px Verdana";
      ctx.fillText(battleCaption(dt.Window, dt.Door), 620, y + 13);
      y += 44;
      ctx.fillStyle = "#475569"; ctx.font = "24px Verdana";

    } else {
      const msg = st === "today"
        ? ["Playing today — 2:30 PM", (prog.name || "") + " is on now — Top 3 will appear here after scores are entered."]
        : st === "not-entered"
        ? ["Scores not entered yet", "Day " + day + " played — Top 3 will appear here once scores are entered."]
        : ["Upcoming", "Top 3 will appear here after the day is played and scores are entered."];
      ctx.fillStyle = "#f1f5f9"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 3;
      roundRect(ctx, 80, y, 1080, 1420 - y, 18); ctx.fill(); ctx.stroke();
      const cy = y + (1420 - y) / 2;
      ctx.fillStyle = "#111111"; ctx.font = "bold 44px Verdana";
      ctx.fillText(msg[0], 620, cy - 40);
      ctx.fillStyle = "#475569"; ctx.font = "26px Verdana";
      ctx.fillText(msg[1], 620, cy + 30);
    }
    drawFoot(ctx);
    saveCanvasPng(cv, "Twelfth-Gala-Day-" + String(day).padStart(2, "0") + "-Poster.png");
  } finally { setDlBusy(btn, false, "⬇️ Download Day " + day + " Poster (PNG)"); }
}
