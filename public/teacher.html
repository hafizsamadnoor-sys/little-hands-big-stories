<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Panel · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">

<body><div id="nav"></div><div class="wrap">
<h1>🧑‍🏫 Teacher Panel</h1>
<div class="statrow" id="ov"></div>
<div id="tiles">
  <div id="tiles-main" class="tiles"></div>
  <div class="section-label" style="margin-top:14px">More</div>
  <div id="tiles-more" class="tiles small"></div>
</div>
<div id="panel"></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Centre for Excellence · S1 — 12th Batch</div>
</div>
<script>
const TABS = [["approvals","📮 Approvals"],["tasks","📅 Weekly Tasks"],["diary","🏖️ Holiday Diary"],
  ["checklist","📋 Checklist"],
  ["challenges","🎯 Challenges"],["students","👥 Students & Accounts"],["parents","👪 Parents"],["points","➕ Points"],
  ["learning","📋 Learning Tasks"],["completion","🎓 Completion"],["marks","📊 Marks"],
  ["wow","🌟 Writer of Week"],["settings","⚙️ Settings"],["activity","📊 Activity"],["account","👤 My Account"],["books","📚 Books"],
  ["messages","💬 Little Hands Messages"],["notices","📢 Notices"],["finance","💰 Finance"]];
let cur = "approvals";
// Tile Grid — white screenshot-style cards (Samad 2026-11-07, NHCE portal style).
// Pale green circle + green line icon + navy label. The tiles ARE the navigation.
const TILE_ICON = { approvals: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9l9 6 9-6"/></svg>',
  diary: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',
  checklist: '<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  learning: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9l2 2 4-4M8 15h8"/></svg>',
  messages: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>',
  students: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M17.5 14.5c2.3.8 3.5 2.8 3.5 5.5"/></svg>',
  parents: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-9.5A4 4 0 0 1 12 7a4 4 0 0 1 7 3.5C19 15.5 12 20 12 20z"/></svg>',
  completion: '<svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5M22 9v5"/></svg>',
  points: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8L12 3z"/></svg>',
  books: '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h13M9 7h6"/></svg>',
  challenges: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a2 2 0 0 0 2 4h1M17 6h3a2 2 0 0 1-2 4h-1"/></svg>',
  marks: '<svg viewBox="0 0 24 24"><path d="M17 3l4 4L8 20l-5 1 1-5L17 3z"/><path d="M14 6l4 4"/></svg>',
  finance: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
  tasks: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h4"/></svg>',
  wow: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9L19 15z"/></svg>',
  notices: '<svg viewBox="0 0 24 24"><path d="M3 11l14-5v12L3 13v-2z"/><path d="M7 13v5a2 2 0 0 0 4 0v-4M17 8a4 4 0 0 1 0 8"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',
  activity: '<svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>' };
// Main tiles first, then the smaller "More" tiles.
const TILE_MAIN = ["approvals", "diary", "checklist", "learning", "messages", "students", "parents", "completion", "points", "books", "challenges", "marks", "finance"];
const TILE_MORE = ["tasks", "wow", "notices", "settings", "activity", "account"];
// Deep link: /teacher.html#messages opens the Messages tab (used by the 🔔 bell).
if (location.hash === "#messages") cur = "messages";
// Bell handler (the 🔔 in the top bar): open the Messages tab.
window.openTeacherMessages = () => { cur = "messages"; render(); window.scrollTo(0, 0); };
(async () => {
  const user = await guard("teacher"); if (!user) return;
  document.getElementById("nav").innerHTML = teacherNav("teacher.html");
  const o = await api("GET", "/api/teacher/overview");
  document.getElementById("ov").innerHTML = `
    <div class="stat" style="--sc:#ea580c;--sc2:#fb923c"><b>${o.pending}</b><span>Waiting approval</span></div>
    <div class="stat" style="--sc:#2563eb;--sc2:#60a5fa"><b>${o.students}</b><span>Students</span></div>
    <div class="stat" style="--sc:#7c3aed;--sc2:#a78bfa"><b>${o.published}</b><span>Published</span></div>
    <div class="stat" style="--sc:#059669;--sc2:#34d399"><b>${o.noPw}</b><span>Need passwords</span></div>`;
  const tabByKey = Object.fromEntries(TABS);
  const tileHtml = (k) => {
    const t = tabByKey[k] || "";
    const sp = t.indexOf(" ");
    const label = sp > -1 ? t.slice(sp + 1) : t;
    return `<div class="tile" data-t="${k}">
      <span class="tile-dot" id="dot-${k}" hidden></span>
      <div class="tile-circ">${TILE_ICON[k] || ""}</div>
      <div class="tile-t">${esc(label)}</div><div class="tile-n" id="tn-${k}"></div></div>`;
  };
  document.getElementById("tiles-main").innerHTML = TILE_MAIN.map(tileHtml).join("");
  document.getElementById("tiles-more").innerHTML = TILE_MORE.map(tileHtml).join("");
  document.getElementById("tiles").onclick = (e) => {
    const b = e.target.closest("[data-t]");
    if (b) { cur = b.dataset.t; render(); document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "start" }); }
  };
  updateTileCounts(o);
  await render();
})();

// Tile Grid live counts — failures leave the static subtitles in place.
async function updateTileCounts(o) {
  const set = (k, txt) => { const el = document.getElementById("tn-" + k); if (el && txt) el.textContent = txt; };
  // Red dot on a tile = something new came and the teacher has not looked
  // at it yet. Messages: unread student messages (same count as the bell).
  // Approvals: works + diaries still waiting. Checklist: ticks newer than
  // the last time the Checklist tab was opened (per-device seen marker).
  const dot = (k, show) => { const el = document.getElementById("dot-" + k); if (el) el.hidden = !show; };
  set("approvals", o.pending + " waiting");
  set("students", o.students + " boys");
  set("parents", o.students + " parents");
  try {
    const [m, l, d, b, c] = await Promise.allSettled([
      api("GET", "/api/teacher/messages"),
      api("GET", "/api/teacher/learning-progress"),
      api("GET", "/api/teacher/holiday-diary"),
      api("GET", "/api/books"),
      api("GET", "/api/teacher/checklists"),
    ]);
    if (m.status === "fulfilled") {
      const seen = +(localStorage.getItem("lhbs_teacher_seen_msg") || 0);
      const fresh = (m.value.messages || []).filter(x => x.sender_role === "student" && x.id > seen).length;
      set("messages", fresh + " new");
      dot("messages", fresh > 0);
    }
    if (l.status === "fulfilled") {
      const list = l.value.students || [];
      const done = list.filter(s => s.pct === 100).length;
      set("learning", done + " / " + (list.length || 38) + " at 100%");
    }
    if (d.status === "fulfilled") {
      const tasks = d.value.tasks || [];
      const entries = tasks.reduce((a, t) => a + ((t.entries || []).length), 0);
      const pend = tasks.reduce((a, t) => a + ((t.entries || []).filter(e => e.status === "pending").length), 0);
      set("diary", entries ? entries + " entries" : "Day 1 open");
      set("approvals", (o.pending + pend) + " waiting");
      dot("approvals", (o.pending + pend) > 0);
    }
    if (b.status === "fulfilled") set("books", (b.value.books || []).length + " books");
    if (c.status === "fulfilled") {
      const tasks = c.value.tasks || [];
      const cur = [...tasks].reverse().find(t => t.open) || tasks[tasks.length - 1];
      if (cur) {
        const ticked = (cur.students || []).filter(s => s.ticked_count > 0).length;
        set("checklist", ticked + " / " + (cur.students || []).length + " ticked");
      }
      let latest = "";
      tasks.forEach(t => (t.students || []).forEach(s => { if (s.ticked_count > 0 && s.ticked_at && s.ticked_at > latest) latest = s.ticked_at; }));
      const seen = localStorage.getItem("lhbs_teacher_seen_checklist") || "";
      dot("checklist", !!latest && latest > seen);
    }
  } catch (e) { /* static subtitles stay */ }
}

async function render() {
  // Unread badges clear when the teacher opens a boy's chat thread (WhatsApp-style),
  // not when the tab opens — see vMessages.
  document.querySelectorAll("#tiles [data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === cur));
  const p = document.getElementById("panel");
  ({ approvals: vApprovals, tasks: vTasks, diary: vDiary, checklist: vChecklist, challenges: vChallenges,
     students: vStudents, parents: vParents, points: vPoints, learning: vLearning, completion: vCompletion, marks: vMarks, wow: vWow, settings: vSettings, activity: vActivity, account: vAccount, books: vBooks, messages: vMessages, notices: vNotices, finance: vFinance })[cur](p);
}

async function vApprovals(p) {
  const d = await api("GET", "/api/teacher/pending");
  const hd = await api("GET", "/api/teacher/holiday-diary");
  const labels = hd.checklist || [];
  // Diary entries the teacher has not looked at yet (status pending).
  const diaryPend = [];
  (hd.tasks || []).forEach(tk => (tk.entries || []).forEach(e => {
    if (e.status === "pending") diaryPend.push({ ...e, taskTitle: tk.title, dayLabel: tk.day_label });
  }));
  const total = d.works.length + diaryPend.length;
  const chkItems = (e) => { try { return e.checklist_items ? JSON.parse(e.checklist_items) : null; } catch (_) { return null; } };
  p.innerHTML = `<h2>📮 Waiting for approval (${total})</h2>`
    + (d.works.length ? `<h3>✍️ Writings (${d.works.length})</h3>` + d.works.map(w => `
    <div class="card"><h3>${esc(w.title)}</h3>
      <p><span class="tag type">${esc(w.type)}</span><span class="tag lang">${esc(w.language)}</span>
      <span class="muted" style="font-size:.85rem">by ${esc(w.author)} · ${fmtDate(w.created_at)}</span>
      ${w.edited_by ? `<br><span class="pill" style="border:1px solid #b45309;color:#b45309">✏️ Edited by ${esc(w.edited_by)}${w.edited_by_class ? ` (${esc(w.edited_by_class)})` : ""}</span>` : ""}</p>
      <div class="card" style="white-space:pre-wrap;box-shadow:none">${esc(w.content)}</div>
      <label>Stars (0–5)</label>
      <select id="st${w.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option></select>
      <label>Points (your choice)</label>
      <input id="pt${w.id}" type="number" min="0" style="width:90px" placeholder="0">
      <div class="muted" id="tot${w.id}" style="font-size:.85rem;margin:4px 0"></div>
      <button class="btn small" data-a="${w.id}">✅ Approve</button>
      <button class="btn small ghost" data-r="${w.id}">❌ Reject</button>
      <div id="rejbox${w.id}" style="display:none;margin-top:8px">
        <label>Why is it rejected? (only the student will see this)</label>
        <textarea id="rejreason${w.id}" rows="2" style="width:100%" placeholder="e.g. The story is too short — write at least 10 lines."></textarea>
        <button class="btn small danger" id="rejgo${w.id}">Confirm reject</button>
        <button class="btn small ghost" id="rejcancel${w.id}">Cancel</button>
      </div>
      <button class="btn small danger" data-d="${w.id}">🗑 Delete</button></div>`).join("") : "")
    + (diaryPend.length ? `<h3>🏖️ Holiday Diary — not yet seen (${diaryPend.length})</h3>` + diaryPend.map(e => {
        const items = chkItems(e);
        return `
    <div class="card"><h3>${esc(e.student_name)} <span class="tag">${esc(e.taskTitle)}</span> <span class="muted" style="font-size:.85rem">${esc(e.dayLabel)}</span> <span class="redbadge">waiting</span></h3>
      <p class="muted" style="font-size:.85rem">📋 Parent checklist: ${items ? items.filter(Boolean).length + " of 17 ticked" : "not ticked yet"}</p>
      <p><b>1. My Diary</b></p><p style="white-space:pre-wrap">${esc(e.diary_text)}</p>
      <p><b>2. My Best Moment</b></p><p style="white-space:pre-wrap">${esc(e.best_moment)}</p>
      <p><b>3. My Good Deed</b></p><p style="white-space:pre-wrap">${esc(e.good_deed)}</p>
      ${items ? `<details style="margin:8px 0"><summary style="cursor:pointer;font-weight:700;font-size:13.5px">📋 Parent's checklist — what the parent ticked (${items.filter(Boolean).length} of 17)</summary>
      ${labels.map((lab, i) => `<div class="ckitem ${items[i] ? "yes" : "no"}"><span class="mk">${items[i] ? "✓" : "–"}</span><span>${esc(lab)}</span></div>`).join("")}</details>` : ""}
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <label>Stars (0–5)</label>
        <select id="dst${e.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option></select>
        <label>Points (your choice — 5 per day)</label>
        <input id="dpt${e.id}" type="number" min="0" value="5" style="width:90px">
        <button class="btn small" data-da="${e.id}">✅ Approve</button>
        <button class="btn small ghost" data-dr="${e.id}">❌ Reject</button>
        <label style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dbonus${e.id}" style="width:18px;height:18px;accent-color:#0b6e5d"> ⭐ Best good deed +5</label>
      </div></div>`; }).join("") : "")
    + (!total ? `<div class="card"><p class="muted">Nothing waiting. 🎉</p></div>` : "");
  d.works.forEach(w => {
    const upd = () => {
      const s = parseInt(document.getElementById("st" + w.id).value || 0);
      const q = parseInt(document.getElementById("pt" + w.id).value || 0);
      document.getElementById("tot" + w.id).textContent = `Total on approval: ${q} + ${s}★ = ${q + s} points`;
    };
    document.getElementById("st" + w.id).onchange = upd;
    document.getElementById("pt" + w.id).oninput = upd;
    upd();
  });
  p.querySelectorAll("[data-a]").forEach(b => b.onclick = () => review(b.dataset.a, "approve"));
  p.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    document.getElementById("rejbox" + b.dataset.r).style.display = "block";
    document.getElementById("rejgo" + b.dataset.r).onclick = () =>
      review(b.dataset.r, "reject", document.getElementById("rejreason" + b.dataset.r).value);
    document.getElementById("rejcancel" + b.dataset.r).onclick = () =>
      document.getElementById("rejbox" + b.dataset.r).style.display = "none";
  });
  p.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    if (confirm("Delete this work?")) { await api("POST", `/api/teacher/work/${b.dataset.d}/delete`); render(); }
  });
  // Diary approvals, right here in the queue (same flow as the Diary tab).
  p.querySelectorAll("[data-da]").forEach(b => b.onclick = async () => {
    try {
      await api("POST", `/api/teacher/holiday-diary/${b.dataset.da}/review`, { decision: "approve", stars: document.getElementById("dst" + b.dataset.da).value, points: document.getElementById("dpt" + b.dataset.da).value });
      const bonusBox = document.getElementById("dbonus" + b.dataset.da);
      if (bonusBox && bonusBox.checked) {
        try { await api("POST", `/api/teacher/holiday-diary/${b.dataset.da}/good-deed-bonus`); toast("Diary approved + best good deed +5! ⭐"); }
        catch (e2) { toast("Diary approved! (bonus: " + e2.message + ")", false); }
      } else toast("Diary approved! ⭐");
      render();
    } catch (e) { toast(e.message, false); }
  });
  p.querySelectorAll("[data-dr]").forEach(b => b.onclick = async () => {
    if (!confirm("Reject this diary? The child will see it was not approved.")) return;
    try { await api("POST", `/api/teacher/holiday-diary/${b.dataset.dr}/review`, { decision: "reject" }); toast("Diary rejected."); render(); }
    catch (e) { toast(e.message, false); }
  });
  async function review(id, decision, reason) {
    try {
      const body = { decision, stars: document.getElementById("st" + id).value };
      if (decision === "approve") body.points = document.getElementById("pt" + id).value || 0;
      if (decision === "reject" && reason) body.reason = reason;
      await api("POST", `/api/teacher/work/${id}/review`, body);
      toast(decision === "approve" ? "Published! ⭐" : "Rejected."); render();
    } catch (e) { toast(e.message, false); }
  }
}

// (compressPhoto lives in app.js — shared by teacher panel, notices, finance QR, and the student chat.)
// Turn URLs into links; YouTube links become embedded players
function richText(t) {
  let h = esc(t || "");
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/<a href="(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,}))[^"]*"[^>]*>[^<]*<\/a>/g,
    '<br><iframe width="100%" height="220" src="https://www.youtube.com/embed/$2" frameborder="0" allowfullscreen style="border-radius:8px;margin:6px 0"></iframe>');
  return h;
}
function mediaHtml(m) {
  if (m.media_data && m.media_type === "image") return `<img src="${m.media_data}" style="max-width:100%;border-radius:8px;margin:6px 0">`;
  return "";
}
// ── WhatsApp-style messages ──────────────────────────────────────────
// Chat list (one row per boy: photo/initial, name, last message, time,
// green unread badge) → tap a boy to open his thread with photo + voice.
// Each boy still sees ONLY his own chat.
let msgThreadId = null; // open chat (student id) or null = chat list
let msgBroadcastOpen = false;
const WA_AV_COLORS = ["#00a884", "#7c3aed", "#d97706", "#2563eb", "#dc2626", "#0891b2", "#db2777", "#65a30d"];
function waAvatar(s) {
  const c = WA_AV_COLORS[(s.id || 0) % WA_AV_COLORS.length];
  if (s.photo) return `<div class="wa-av" style="padding:0"><img src="${esc(s.photo)}" alt=""></div>`;
  return `<div class="wa-av" style="background:${c}">${esc((s.display_name || "?").trim().charAt(0))}</div>`;
}
function waPreview(m) {
  if (!m) return "";
  if (m.media_type === "image") return "📷 Photo";
  if (m.media_type === "audio") return "🎤 Voice message";
  return m.text || "";
}
function waListTime(ts) {
  try {
    const d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { day: "numeric", month: "numeric" });
  } catch (e) { return ""; }
}
async function vMessages(p) {
  const [sdata, mdata] = await Promise.all([api("GET", "/api/teacher/students"), api("GET", "/api/teacher/messages")]);
  const students = sdata.students || [];
  const msgs = mdata.messages || [];
  if (msgThreadId) return vMsgThread(p, students, msgThreadId);
  const seen = +(localStorage.getItem("lhbs_teacher_seen_msg") || 0);
  const last = {}, unread = {};
  for (const m of msgs) { // newest first
    if (!last[m.sid]) last[m.sid] = m;
    if (m.sender_role === "student" && m.id > seen) unread[m.sid] = (unread[m.sid] || 0) + 1;
  }
  const rows = students.map(s => ({ s, m: last[s.id] || null, u: unread[s.id] || 0 }));
  rows.sort((a, b) => {
    if (a.m && b.m) return new Date(b.m.created_at) - new Date(a.m.created_at);
    if (a.m) return -1; if (b.m) return 1;
    return (a.s.display_name || "").localeCompare(b.s.display_name || "");
  });
  p.innerHTML = `<h2>💬 Little Hands Messages</h2>
    <div class="wa-list">
      <div class="wa-row" id="msg_bc_btn" style="background:#e7f8f1">
        <div class="wa-av" style="background:#075e54">📣</div>
        <div class="wa-mid"><div class="wa-nm">Send to all 38 boys</div><div class="wa-pv">One message to everyone</div></div>
      </div>

async function vFinance(p) {
  const [fdata, sdata, fset, gdata] = await Promise.all([
    api("GET", "/api/teacher/finance"),
    api("GET", "/api/teacher/students"),
    api("GET", "/api/teacher/finance-settings"),
    api("GET", "/api/teacher/general-expenses")
  ]);
  const students = sdata.students.slice().sort((a, b) => a.display_name.localeCompare(b.display_name));
  const cats = fdata.categories || ["Store", "Medical", "Bus cash", "Book", "Trip", "Other"];
  const bal = {};
  for (const e of fdata.entries) {
    if (!bal[e.student_id]) bal[e.student_id] = { name: e.student, red: 0, green: 0 };
    bal[e.student_id][e.direction] += Number(e.amount) || 0;
  }
  const balList = Object.entries(bal).map(([sid, b]) => ({ sid: Number(sid), ...b, net: b.green - b.red }))
    .sort((a, b) => Math.abs(b.net) - Math.abs(a.net));
  const money = n => "₹" + (Math.round(n * 100) / 100).toLocaleString("en-IN");
  const dirPill = d => d === "red"
    ? `<span class="pill" style="border:1px solid #dc2626;color:#dc2626">🔴 To receive</span>`
    : `<span class="pill" style="border:1px solid #16a34a;color:#16a34a">🟢 To pay</span>`;
  let selStudent = students.length ? students[0].id : null;
  const renderLedger = () => {
    const rows = fdata.entries.filter(e => e.student_id === selStudent);
    const b = bal[selStudent] || { red: 0, green: 0 };
    const net = b.green - b.red;
    document.getElementById("fin_ledger").innerHTML =
      `<h3>Ledger — ${esc((students.find(x => x.id === selStudent) || {}).display_name || "")}</h3>` +
      (rows.length ? rows.map(e => `
        <div class="card" style="margin:8px 0;padding:10px 14px">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <div><b>${esc(e.category)}</b> ${e.note ? `<span class="muted">— ${esc(e.note)}</span>` : ""}
              <div class="muted" style="font-size:.78rem">${fmtDateTime(e.created_at)}${e.paid_at ? " · ✅ Paid" : ""}</div></div>
            <div style="text-align:right"><b style="font-size:1.1rem;color:${e.direction === "red" ? "#dc2626" : "#16a34a"}">${money(e.amount)}</b><br>${dirPill(e.direction)}</div>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <button class="btn small" data-fpaid="${e.id}">${e.paid_at ? "↩️ Mark unpaid" : "✅ Mark paid"}</button>
            <button class="btn small danger" data-fdel="${e.id}">Delete</button>
          </div>
        </div>`).join("") : `<div class="card"><p class="muted">No entries yet for this student.</p></div>`) +
      `<div class="card" style="background:#f8fafc"><b>Balance: </b>
        <b style="color:${net < 0 ? "#dc2626" : net > 0 ? "#16a34a" : "#64748b"}">${net === 0 ? money(0) + " — settled" : (net < 0 ? "🔴 " + money(-net) + " to receive" : "🟢 " + money(net) + " to pay")}</b></div>`;
    document.querySelectorAll("[data-fpaid]").forEach(x => x.onclick = async () => {
      await api("POST", `/api/teacher/finance/${x.dataset.fpaid}/paid`); toast("Updated."); location.reload();
    });
    document.querySelectorAll("[data-fdel]").forEach(x => x.onclick = async () => {
      if (confirm("Delete this entry?")) { await api("POST", `/api/teacher/finance/${x.dataset.fdel}/delete`); toast("Deleted."); location.reload(); }
    });
  };
  const nStudents = students.length || 38;
  const fundBal = gdata.fund_balance || 0;
  const gexpHtml = (gdata.expenses || []).length ? (gdata.expenses || []).map(g => `
    <div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:4px;align-items:center">
      <span><b>₹${g.amount}</b> ${esc(g.category)}${g.note ? ` — ${esc(g.note)}` : ""} <span class="muted" style="font-size:.78rem">${fmtDateTime(g.created_at)}</span></span>
      <span><span class="muted" style="font-size:.85rem">₹${g.per_child} × ${nStudents} = ₹${g.per_child * nStudents} · ₹${g.surplus} to fund</span>
      <button class="btn small danger" data-gdel="${g.id}" style="margin-left:8px">Undo</button></span>
    </div>`).join("") : `<p class="muted">No general expenses yet.</p>`;
  p.innerHTML = `<h2>💰 Finance</h2>
    <div class="card" style="border:2px solid #0e7c8c"><h3>🏫 General Expense — split among all ${nStudents} students</h3>
      <p class="muted" style="font-size:.85rem">Spent for the whole class? Enter the amount — it is divided equally among all ${nStudents} students, rounded up to the nearest rupee per child. The extra goes to the class General Fund.</p>
      <div class="grid cols2">
        <div><label>Amount spent (₹)</label><input id="gen_amt" type="number" min="1" step="any" placeholder="e.g. 170"></div>
        <div><label>Category</label><select id="gen_cat">${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
      </div>
      <label>What was it for? (optional)</label><input id="gen_note" placeholder="e.g. Chart paper for class">
      <div id="gen_preview" class="muted" style="margin:8px 0;font-size:.9rem"></div>
      <button class="btn" id="gen_add">Split among all ${nStudents} students</button>
      <div style="margin-top:12px;padding:10px 14px;background:#f0fdf4;border-radius:8px"><b>🏦 General Fund balance: ₹${fundBal}</b> <span class="muted" style="font-size:.85rem">(surplus from rounded-up splits)</span></div>
      <div style="margin-top:10px"><h3 style="margin:6px 0">General expense history</h3>${gexpHtml}</div></div>
    <div class="card"><h3>➕ Add entry</h3>
      <div class="grid cols2">
        <div><label>Student</label><select id="fin_student">${students.map(x => `<option value="${x.id}">${esc(x.display_name)}</option>`).join("")}</select></div>
        <div><label>Category</label><select id="fin_cat">${cats.map(c => `<option>${esc(c)}</option>`).join("")}</select></div>
        <div><label>Amount (₹)</label><input id="fin_amt" type="number" min="1" step="any" placeholder="e.g. 120"></div>
        <div><label>Direction</label><select id="fin_dir">
          <option value="red">🔴 Parent pays me (to receive)</option>
          <option value="green">🟢 I pay / hold for parent (to pay)</option></select></div>
      </div>
      <label>Note (optional)</label><input id="fin_note" placeholder="e.g. Medicines from pharmacy">
      <button class="btn" id="fin_add">Add entry</button></div>
    <div class="card"><h3>📒 Student ledger</h3>
      <label>Student</label><select id="fin_view">${students.map(x => `<option value="${x.id}">${esc(x.display_name)}</option>`).join("")}</select>
      <div id="fin_ledger"></div></div>
    <h2>📊 All balances</h2>
    <div class="card" style="padding:6px 14px">` + (balList.length ? balList.map(b => {
        const net = b.net;
        const txt = net === 0 ? `<span class="muted">settled</span>`
          : net < 0 ? `<b style="color:#dc2626">🔴 ${money(-net)} to receive</b>`
          : `<b style="color:#16a34a">🟢 ${money(net)} to pay</b>`;
        return `<div style="display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #f1f5f9">
          <span>${esc(b.name)}</span><span>${txt}</span></div>`;
      }).join("") : `<p class="muted">No finance entries yet.</p>`) + `</div>
    <div class="card"><h3>📱 Payment details (shown to parents)</h3>
      <p class="muted" style="font-size:.85rem">Your UPI ID and scanner QR appear on the parent's Finance page so they can pay you.</p>
      <label>UPI ID / payable number</label><input id="fin_upi" placeholder="e.g. name@upi" value="${esc(fset.settings.upi_id || "")}">
      <label>Scanner QR photo</label><input type="file" id="fin_qr" accept="image/*">
      ${fset.settings.upi_qr ? `<img src="${fset.settings.upi_qr}" style="max-width:160px;border-radius:8px;margin:8px 0" alt="UPI QR">` : ""}
      <button class="btn" id="fin_save_upi">Save payment details</button></div>`;
  document.getElementById("fin_add").onclick = async () => {
    const body = {
      student_id: Number(document.getElementById("fin_student").value),
      category: document.getElementById("fin_cat").value,
      amount: document.getElementById("fin_amt").value,
      direction: document.getElementById("fin_dir").value,
      note: document.getElementById("fin_note").value
    };
    if (!body.amount || Number(body.amount) <= 0) { toast("Enter a valid amount.", false); return; }
    try { await api("POST", "/api/teacher/finance", body); toast("Entry added. 💰"); location.reload(); }
    catch (e) { toast(e.message, false); }
  };
  const genAmt = document.getElementById("gen_amt");
  const genPrev = document.getElementById("gen_preview");
  const updateGenPreview = () => {
    const a = parseFloat(genAmt.value) || 0;
    if (!a || a <= 0) { genPrev.textContent = ""; return; }
    const pc = Math.ceil(a / nStudents);
    const tot = pc * nStudents;
    const sur = Math.round((tot - a) * 100) / 100;
    genPrev.innerHTML = `₹${a} ÷ ${nStudents} = <b>₹${pc} per child</b> · Total ₹${tot}${sur > 0 ? ` · <b>₹${sur} to General Fund</b>` : ""}`;
  };
  genAmt.oninput = updateGenPreview;
  document.getElementById("gen_add").onclick = async () => {
    const amt = parseFloat(genAmt.value) || 0;
    if (!amt || amt <= 0) { toast("Enter a valid amount.", false); return; }
    const body = { amount: amt, category: document.getElementById("gen_cat").value, note: document.getElementById("gen_note").value };
    if (!confirm(`Split ₹${amt} among all ${nStudents} students? Each child gets ₹${Math.ceil(amt / nStudents)}.`)) return;
    try {
      const r = await api("POST", "/api/teacher/general-expense", body);
      toast(`Split done! ₹${r.per_child} × ${r.count} students. ₹${r.surplus} to General Fund. 💰`);
      location.reload();
    } catch (e) { toast(e.message, false); }
  };
  document.querySelectorAll("[data-gdel]").forEach(x => x.onclick = async () => {
    if (!confirm("Undo this general expense? It will remove all 38 child entries and take the surplus back out of the General Fund.")) return;
    try { await api("POST", `/api/teacher/general-expense/${x.dataset.gdel}/delete`); toast("General expense undone."); location.reload(); }
    catch (e) { toast(e.message, false); }
  });
  const vsel = document.getElementById("fin_view");
  selStudent = Number(vsel.value);
  vsel.onchange = () => { selStudent = Number(vsel.value); renderLedger(); };
  renderLedger();
  document.getElementById("fin_save_upi").onclick = async () => {
    const upi_id = document.getElementById("fin_upi").value.trim();
    const qf = document.getElementById("fin_qr").files[0];
    let upi_qr = null;
    if (qf) { try { const c = await compressPhoto(qf); upi_qr = c.data; } catch (e) { toast("QR photo failed.", false); return; } }
    try { await api("POST", "/api/teacher/finance-settings", { upi_id, upi_qr }); toast("Payment details saved. 📱"); }
    catch (e) { toast(e.message, false); }
  };
}

// approving a diary shows the bonus result right away, no re-tap needed).
const openDiaryRows = new Set();
async function vDiary(p) {
  const d = await api("GET", "/api/teacher/holiday-diary");

  };
  p.innerHTML = `
    <div class="card"><h2>🔒 Writing lock (holiday leave)</h2>
      <p>General writing (Story, Diary, Letter, Poem, Manifesto, Write Anything, Book Review) is currently <b>${lk.locked ? "🔒 LOCKED" : "🔓 open"}</b> for students and mentors. Holiday Diary submissions are never blocked by this lock.</p>
      <button class="btn" id="locktoggle">${lk.locked ? "🔓 Unlock writing" : "🔒 Lock writing for the leave"}</button></div>
    <h2>🏖️ Holiday Diary — 7, 8, 9 November</h2>
    <p class="muted">Diary text is private — only you and the child can read it. Tap a name to open that child's diary and the parent's checklist, then confirm and give points. 🔴 Red dot = waiting for approval.</p>
    ${d.tasks.map(tk => {
      const pend = tk.entries.filter(e => e.status === "pending").length;

    <div class="card"><h3>${esc(tk.title)} <span class="tag">${esc(tk.day_label)}</span> <span class="muted" style="font-size:.85rem">${tk.open ? "● Open" : "🔒 Opens " + esc(tk.start_date)}</span>${pend ? ` <span class="redbadge">${pend} pending</span>` : ""}</h3>
      ${tk.entries.length ? tk.entries.map(e => {

        <div class="st">${e.status === "approved" ? `✅ Approved · ⭐ ${e.stars} · +${e.points_awarded} pts` : e.status === "rejected" ? "❌ Not approved" : "⏳ Waiting"} · ${chkLine(e)}</div>

          ${items ? `
          <div class="chkhead">📋 Parent's checklist — what the parent ticked <span>(${items.filter(Boolean).length} of 17)</span></div>

          <div class="chkline">📋 Parent checklist: <b>not ticked yet</b> — the parent has not ticked the 17 items.</div>`}
          ${e.status !== "approved" ? `
          <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap">
            <label>Stars (0–5)</label>
            <select id="dst${e.id}"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option></select>

            <input id="dpt${e.id}" type="number" min="0" value="5" style="width:90px">
            <button class="btn small" data-da="${e.id}">✅ Approve</button>
            <button class="btn small ghost" data-dr="${e.id}">❌ Reject</button>
            <label style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dbonus${e.id}" style="width:18px;height:18px;accent-color:#0b6e5d"> ⭐ Best good deed +5</label>
          </div>` : `
          <div style="margin-top:12px">${e.bonus_given ? `<span class="pill">⭐ Best good deed +5 given</span>` : `<button class="btn small" data-db="${e.id}">⭐ Best good deed +5</button>`}</div>`}
        </div>
      </div>`; }).join("") : `<p class="muted">No diaries submitted yet for this day.</p>`}
    </div>`; }).join("")}`;

      const row = document.querySelector(`[data-nr="${b.dataset.da}"]`);
      if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    catch (e) { toast(e.message, false); }
  });
  p.querySelectorAll("[data-dr]").forEach(b => b.onclick = async () => {
    if (!confirm("Reject this diary? The child will see it was not approved.")) return;
    try { await api("POST", `/api/teacher/holiday-diary/${b.dataset.dr}/review`, { decision: "reject" }); toast("Diary rejected."); openDiaryRows.add(+b.dataset.dr); render(); }
    catch (e) { toast(e.message, false); }
  });
  p.querySelectorAll("[data-db]").forEach(b => b.onclick = async () => {
    try { await api("POST", `/api/teacher/holiday-diary/${b.dataset.db}/good-deed-bonus`); toast("Best good deed +5 given! ⭐"); openDiaryRows.add(+b.dataset.db); render(); }
    catch (e) { toast(e.message, false); }
  });
}

// Checklist tab — every parent's ticks, one place. All 38 children per day,
// most-ticked first, tap a name to see exactly which of the 17 items.
// A child shows here even when the child has not written the diary yet.
const openChecklistRows = new Set();
let checklistSort = "latest"; // "latest" = latest ticked first (default); "most" = most ticks first
async function vChecklist(p) {
  const d = await api("GET", "/api/teacher/checklists");
  const labels = d.checklist || [];
  const chkItems = (s) => { try { return s.checklist_items ? JSON.parse(s.checklist_items) : null; } catch (_) { return null; } };
  const diaryTxt = (s) => s.diary_status === "approved" ? "✅ Diary approved" : s.diary_status === "pending" ? "⏳ Diary waiting" : s.diary_status === "rejected" ? "❌ Diary not approved" : "Diary not written yet";
  p.innerHTML = `<h2>📋 Checklist — Holiday Diary</h2>
    <p class="muted">Parents tick 17 items each day. Tap a name to see how much that child got — and exactly which items. 🔴 Red dot = parent has not ticked yet. ⭐ 1 tick = 1 point.</p>
    <div style="display:flex;gap:6px;margin:8px 0 12px">
      <button class="btn small${checklistSort === "latest" ? "" : " ghost"}" id="csLatest">🕐 Latest first</button>
      <button class="btn small${checklistSort === "most" ? "" : " ghost"}" id="csMost">📊 Most ticks first</button>
    </div>
    ${d.tasks.map(tk => {
      const ticked = tk.students.filter(s => s.ticked_count > 0);
      const avg = ticked.length ? (ticked.reduce((a, s) => a + s.ticked_count, 0) / ticked.length).toFixed(1) : "0";
      const total = ticked.reduce((a, s) => a + s.ticked_count, 0);
      const totalPts = ticked.reduce((a, s) => a + (s.points_awarded || 0), 0);
      const rows = [...tk.students].sort((a, b) => checklistSort === "most"
        ? b.ticked_count - a.ticked_count || a.display_name.localeCompare(b.display_name)
        : ((b.ticked_count > 0) - (a.ticked_count > 0)) || (a.ticked_count > 0 ? (b.ticked_at || "").localeCompare(a.ticked_at || "") : a.display_name.localeCompare(b.display_name)));
      return `
    <div class="card"><h3>${esc(tk.title)} <span class="tag">${esc(tk.day_label)}</span> <span class="muted" style="font-size:.85rem">${tk.open ? "● Open" : "🔒 Opens " + esc(tk.start_date)}</span></h3>
      <div class="cksum"><b>${ticked.length} of ${tk.students.length} parents ticked</b>
      <p>Average ${avg} of 17 items · ${total} ticks in total · ⭐ ${totalPts} points given</p>
      <div class="cksumbar"><i style="width:${Math.round(ticked.length / (tk.students.length || 1) * 100)}%"></i></div></div>
      ${rows.map(s => {
        const items = chkItems(s);
        const pct = Math.round(s.ticked_count / 17 * 100);
        return `
      <div class="namerow" data-cr="${tk.id}-${s.id}">
        <div class="top"><span class="dot${s.ticked_count > 0 ? " none" : ""}"></span><span class="nm">${esc(s.display_name)}</span>${s.ticked_count > 0 ? `<span class="pts-pill">+${s.points_awarded || 0} pts</span>` : ""}<span class="cnt">${s.ticked_count} of 17</span><span class="chev">›</span></div>
        <div class="ckbar"><i style="width:${pct}%"></i></div>
        <div class="detail">
          ${items ? `
          <div class="chkhead">📋 What the parent ticked <span>(${s.ticked_count} of 17${s.ticked_at ? " · " + fmtDateTime(s.ticked_at) : ""})</span></div>
          ${labels.map((lab, i) => `<div class="ckitem ${items[i] ? "yes" : "no"}"><span class="mk">${items[i] ? "✓" : "–"}</span><span>${esc(lab)}</span></div>`).join("")}` : `
          <div class="chkline">📋 Parent checklist: <b>not ticked yet</b> — the parent has not ticked the 17 items.</div>`}
          ${s.ticked_count > 0 ? `<p class="dstat">⭐ <b>+${s.points_awarded || 0} points</b> — 1 point for each of the ${s.ticked_count} ticks</p>` : ""}
          <p class="dstat">${diaryTxt(s)}</p>
        </div>
      </div>`; }).join("")}
    </div>`; }).join("")}`;
  // Sort buttons: switch the order and re-render (expanded rows survive).
  document.getElementById("csLatest").onclick = () => { checklistSort = "latest"; render(); };
  document.getElementById("csMost").onclick = () => { checklistSort = "most"; render(); };
  // Opening this tab marks the checklists as seen — the red dot clears.
  try {
    let latest = "";
    d.tasks.forEach(tk => (tk.students || []).forEach(s => { if (s.ticked_count > 0 && s.ticked_at && s.ticked_at > latest) latest = s.ticked_at; }));
    if (latest) localStorage.setItem("lhbs_teacher_seen_checklist", latest);
    const de = document.getElementById("dot-checklist"); if (de) de.hidden = true;
  } catch (e) {}
  // Re-open rows the teacher had expanded (they survive re-render).
  p.querySelectorAll(".namerow").forEach(row => { if (openChecklistRows.has(row.dataset.cr)) row.classList.add("open"); });
  // Tap a name row to expand / collapse (not when tapping a control inside it).
  p.querySelectorAll(".namerow").forEach(row => row.onclick = (ev) => {
    if (ev.target.closest("button, select, input, a, label")) return;
    const id = row.dataset.cr;
    if (row.classList.toggle("open")) openChecklistRows.add(id); else openChecklistRows.delete(id);
  });
}

    <p class="muted">See every point given to a boy. Edit or delete any single entry.</p>
    <label>Student</label><select id="h_s">${opts}</select>
    <button class="btn" id="h_go" style="margin-top:4px">Show history</button>
    <div id="h_list" style="margin-top:12px"></div></div>`;
  document.getElementById("p_go").onclick = async () => {
    try {
      const r = await api("POST", "/api/teacher/adjust-points", { student_id: document.getElementById("p_s").value,
        points: document.getElementById("p_n").value, reason: document.getElementById("p_r").value });
      toast(`Done. New total: ${r.total} pts.`);
    } catch (e) { toast(e.message, false); }
  };
  const setTotal = async (val) => {
    try {
      const r = await api("POST", "/api/teacher/set-points", { student_id: document.getElementById("sp_s").value, points: val });
      toast(`Done. New total: ${r.total} pts.`);
    } catch (e) { toast(e.message, false); }
  };
  document.getElementById("sp_go").onclick = () => setTotal(document.getElementById("sp_n").value);
  document.getElementById("sp_reset").onclick = async () => {
    const s = document.getElementById("sp_s");
    const name = s.options[s.selectedIndex].text;
    if (confirm(`Reset ${name}'s points to 0?`)) setTotal(0);
  };
  const loadHistory = async () => {
    const sid = document.getElementById("h_s").value;
    const box = document.getElementById("h_list");
    try {
      const r = await api("GET", `/api/teacher/student/${sid}/points-log`);
      if (!r.log.length) { box.innerHTML = `<p class="muted">No points yet.</p>`; return; }
      box.innerHTML = `<p><b>Total: ${r.total} pts</b></p><table>
        <thead><tr><th>Date</th><th>Pts</th><th>Reason</th><th></th></tr></thead><tbody>` +
        r.log.map(e => `<tr>
          <td style="font-size:.78rem;white-space:nowrap">${esc((e.created_at || "").slice(0, 10))}</td>
          <td><b style="color:${e.points >= 0 ? "var(--green)" : "#dc2626"}">${e.points > 0 ? "+" : ""}${e.points}</b></td>
          <td style="font-size:.85rem">${esc(e.reason)}</td>
          <td style="white-space:nowrap">
            <button class="btn small ghost" onclick="editPts(${e.id},${e.points},'${esc(e.reason).replace(/'/g, "\\'")}')">✏️</button>
            <button class="btn small danger" onclick="delPts(${e.id})">🗑️</button>
          </td></tr>`).join("") + `</tbody></table>`;
    } catch (e) { toast(e.message, false); }
  };
  document.getElementById("h_go").onclick = loadHistory;
  window.editPts = async (id, curPts, curReason) => {
    const np = prompt("New points value:", curPts);
    if (np === null) return;
    const nr = prompt("Reason:", curReason);
    if (nr === null) return;
    try {
      const r = await api("POST", `/api/teacher/points-log/${id}`, { points: np, reason: nr });
      toast(`Updated. New total: ${r.total} pts.`);
      loadHistory();
    } catch (e) { toast(e.message, false); }
  };
  window.delPts = async (id) => {
    if (!confirm("Delete this points entry?")) return;
    try {
      const r = await api("DELETE", `/api/teacher/points-log/${id}`);
      toast(`Deleted. New total: ${r.total} pts.`);
      loadHistory();
    } catch (e) { toast(e.message, false); }
  };
}

    const avg = students.length ? Math.round(students.reduce((a, s) => a + s.pct, 0) / students.length) : 0;
    const top = students[0];

        <svg width="104" height="104" viewBox="0 0 104 104" style="flex:0 0 auto">
          <circle cx="52" cy="52" r="40" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/>
          <circle class="avgring" data-off="${(C * (1 - avg / 100)).toFixed(1)}" cx="52" cy="52" r="40" fill="none"
            stroke="#fbbf24" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"
            transform="rotate(-90 52 52)" style="transition:stroke-dashoffset 1.2s ease"/>

        </svg>
        <div style="flex:1;min-width:200px">
          <h2 style="color:#fff;margin:0 0 4px">📋 Learning Tasks</h2>
          <p style="color:#c9e8ee;margin:0 0 8px;font-size:.9rem">Quran, duas &amp; speech — tick what each child completes.</p>
          <p style="color:#fff;margin:0"><b>${done100} of ${students.length}</b> at 100%${top ? ` · 🏆 <b>${esc(top.display_name)}</b> (${top.pct}%)` : ""}</p>
        </div>
      </div>`;
    // Total summary graph: one horizontal bar per student, ranked
    const rows = students.map(s => {
      const col = s.pct >= 80 ? "#16a34a" : s.pct >= 50 ? "#0e7c8c" : s.pct >= 25 ? "#ea580c" : "#dc2626";
      return `<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
        <div style="width:118px;flex:0 0 auto;font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(s.display_name)}">${esc(s.display_name)}</div>
        <div style="flex:1;background:#e2e8f0;border-radius:99px;height:16px;overflow:hidden">
          <div class="tbar" data-w="${s.pct}" style="width:0;background:${col};height:100%;border-radius:99px;transition:width 1s ease"></div></div>
        <b style="width:46px;flex:0 0 auto;text-align:right;font-size:.82rem">${s.pct}%</b></div>`;
    }).join("");
    document.getElementById("lt_class").innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px">
        <div style="background:linear-gradient(135deg,#0b3c46,#0e7c8c);color:#fff;border-radius:14px;padding:14px;text-align:center">

        <div style="background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(11,60,70,.08)">

        <div style="background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(11,60,70,.08)">

      </div>
      <div class="section-label">Total summary — all students, ranked</div>
      ${rows || "<p class='muted'>No students.</p>"}`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.querySelectorAll("#lt_banner .avgring").forEach(c => { c.style.strokeDashoffset = c.dataset.off; });
      document.querySelectorAll("#lt_class .tbar").forEach(b => { b.style.width = b.dataset.w + "%"; });

  };
  window.delLearnTask = async (id) => {

      document.getElementById("sb_rows").innerHTML = rows || `<tr><td colspan="5" class="muted">No students.</td></tr>`;
    } catch (e) { document.getElementById("sb_rows").innerHTML = `<tr><td colspan="5" class="muted">Could not load summary.</td></tr>`; }
  }
  await loadTasks(); await loadStudents(); await loadClass(); await loadGuests(); await loadSummary();
}

        <td style="white-space:nowrap">${r.issued
          ? `<button class="btn small ghost" data-revoke="${r.id}">Revoke cert</button>`
          : (r.exam_passed
            ? `<button class="btn small" data-issue="${r.id}">Issue certificate</button> <button class="btn small ghost" data-unpass="${r.id}">↩️ Unmark exam</button>`
            : `<button class="btn small" data-pass="${r.id}">✅ Exam passed</button>`)}</td>
      </tr>`).join("")}
    </table>` : `<p class="muted">No boy is at 100% yet.</p>`}`;

    toast("Exam marked passed ✔"); vCompletion(p);

  p.querySelectorAll("[data-unpass]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove the exam-passed mark for this boy?")) return;

    if (ru.error) return alert(ru.error);
    toast("Exam mark removed"); vCompletion(p);
  });
  p.querySelectorAll("[data-issue]").forEach(b => b.onclick = async () => {
    if (!confirm("Issue the completion certificate for this boy?")) return;
    const r = await api("POST", "/api/teacher/completion-cert/" + b.dataset.issue + "/issue");

    toast("Certificate issued ✔"); vCompletion(p);
  });
  p.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
    if (!confirm("Revoke this completion certificate?")) return;
    await api("POST", "/api/teacher/completion-cert/" + b.dataset.revoke + "/revoke");
    toast("Certificate revoked"); vCompletion(p);
  });
}

      <input id="mk_grade" placeholder="Grade (e.g. A+)">
    </div>
    <button class="btn" style="margin-top:8px" onclick="saveMark()">💾 Save Marks</button>
  </div>
  <div class="card">
    <h3>📋 All Marks</h3>
    <div style="overflow-x:auto"><table style="width:100%;font-size:.85rem">
      <tr><th>Student</th><th>Subject</th><th>Exam</th><th>Marks</th><th>Grade</th><th></th></tr>
      <tbody id="mk_rows"></tbody>
    </table></div>
  </div>`;
  const ss = await api("GET", "/api/teacher/students");
  document.getElementById("mk_student").innerHTML =
    ss.students.map(s => `<option value="${s.id}">${esc(s.display_name)} (${s.ad_no})</option>`).join("");
  window.saveMark = async () => {
    const body = {
      student_id: +document.getElementById("mk_student").value,
      subject: document.getElementById("mk_subject").value.trim(),
      exam: document.getElementById("mk_exam").value.trim(),
      marks: parseFloat(document.getElementById("mk_marks").value),
      max_marks: parseFloat(document.getElementById("mk_max").value) || 100,
      grade: document.getElementById("mk_grade").value.trim()
    };
    if (!body.subject || isNaN(body.marks)) return alert("Subject and marks required.");
    await api("POST", "/api/teacher/marks", body);
    document.getElementById("mk_subject").value = "";
    document.getElementById("mk_marks").value = "";
    document.getElementById("mk_grade").value = "";
    loadMarks();
  };
  window.delMark = async (id) => {
    if (!confirm("Delete this mark entry?")) return;
    await api("DELETE", "/api/teacher/marks/" + id);
    loadMarks();
  };
  async function loadMarks() {
    const d = await api("GET", "/api/teacher/marks");
    document.getElementById("mk_rows").innerHTML = d.marks.map(m => `
      <tr><td>${esc(m.student_name)}</td><td>${esc(m.subject)}</td><td>${esc(m.exam)}</td>
      <td><b>${m.marks}</b>/${m.max_marks}</td><td>${esc(m.grade)}</td>
      <td><button class="btn ghost small" onclick="delMark(${m.id})">🗑️</button></td></tr>`).join("")
      || `<tr><td colspan="6" class="muted">No marks yet.</td></tr>`;
  }
  await loadMarks();
}

async function vWow(p) {
  const [d, wd, wdata, nu] = await Promise.all([
    api("GET", "/api/teacher/students"),
    api("GET", "/api/writer-of-week"),
    api("GET", "/api/works"),
    api("GET", "/api/next-up").catch(() => null),
  ]);
  const students = d.students || [];
  const works = (wdata.works || []);
  const w = wd.writer, hist = wd.history || [];
  const fillWorks = (sid) => {
    const mine = works.filter(x => String(x.author_id) === String(sid));
    document.getElementById("w_w").innerHTML =
      `<option value="">— No work (just the writer) —</option>` +
      mine.map(x => `<option value="${x.id}">“${esc(x.title)}” — ${esc(x.type)}</option>`).join("");
  };
  p.innerHTML = `<div class="card"><h2>🌟 Select Writer of the Week</h2>
    <label>Student</label><select id="w_s">${students.map(s => `<option value="${s.id}">${esc(s.display_name)}</option>`).join("")}</select>
    <label>Winning work</label><select id="w_w"></select>
    <label>Message</label><input id="w_n" placeholder="Why is he this week's writer?">
    <button class="btn" id="w_go_pub">🌟 Set + Publish everywhere</button>
    <button class="btn ghost" id="w_go" style="margin-top:8px">Set only (no post yet)</button>
    <p class="muted" style="margin-top:10px">Publishing sends, in one tap: 📢 a notice to <b>all students + all parents</b> · 💬 a congratulations message to <b>the winner</b> · 🌟 the card on <b>student + parent pages</b>.</p></div>
  ${w ? `<div class="card"><h2>🌟 Current Writer of the Week</h2>
    ${window.wowCardHtml(w, [], nu && nu.wow_next)}
    <p class="muted" style="margin-top:10px">${w.published_at ? "✅ Published on " + fmtDateTime(w.published_at) + " — notice sent, winner messaged." : "⏳ Not published yet — no notice or message sent."}</p>
    ${w.published_at ? "" : `<button class="btn" id="w_pub">📢 Publish now</button>`}
  </div>` : ""}
  ${hist.length ? `<div class="card"><h2>🕰️ Past writers</h2>${hist.map(h => {
    const dd = h.created_at ? new Date(h.created_at + "Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
    return `<div class="wow-past"><div class="wow-av">🌟</div><div><b>${esc(h.display_name)}</b><span>${h.work_title ? "“" + esc(h.work_title) + "” · " : ""}${dd}</span></div></div>`;
  }).join("")}</div>` : ""}`;
  fillWorks(document.getElementById("w_s").value);
  document.getElementById("w_s").onchange = (e) => fillWorks(e.target.value);
  const setWow = async (publish) => {
    try {
      const r = await api("POST", "/api/teacher/writer-of-week", {
        student_id: document.getElementById("w_s").value,
        work_id: document.getElementById("w_w").value || null,
        note: document.getElementById("w_n").value, publish,
      });
      toast(publish ? "Writer of the Week published everywhere! 🌟" : "Writer of the Week set! 🌟");
      render();
    } catch (e) { toast(e.message, false); }
  };
  document.getElementById("w_go_pub").onclick = () => setWow(true);
  document.getElementById("w_go").onclick = () => setWow(false);
  const pb = document.getElementById("w_pub");
  if (pb) pb.onclick = async () => {
    try { await api("POST", "/api/teacher/writer-of-week/publish", {}); toast("Published! 🌟"); render(); }
    catch (e) { toast(e.message, false); }
  };
}

async function vSettings(p) {
  const d = await api("GET", "/api/teacher/point-settings");
  const labels = { per_star: "⭐ Per star", read: "👁️ Reading a story", like_received: "❤️ Receiving a like",
challenge: "🎯 Challenge", quiz_correct: "🧠 Quiz (per correct)", featured: "🌟 Featured bonus" };
  p.innerHTML = `<div class="card"><h2>⚙️ Point values</h2>
    ${Object.keys(labels).map(k => `<label>${labels[k]}</label><input type="number" min="0" id="ps_${k}" value="${d.settings[k] ?? 0}">`).join("")}
    <button class="btn" id="ps_go">Save</button></div>`;
  document.getElementById("ps_go").onclick = async () => {
    const body = {}; Object.keys(labels).forEach(k => body[k] = document.getElementById("ps_" + k).value);
    try { await api("POST", "/api/teacher/point-settings", body); toast("Point values saved."); }
    catch (e) { toast(e.message, false); }
  };
}

async function vActivity(p) {
  const d = await api("GET", "/api/teacher/activity");
  const KICON = { points: "✨", login: "🔑", tick: "✅", untick: "↩️", submit: "📮" };
  const RNAME = { student: "🧑‍🎓 Student", parent: "👪 Parent", guest: "👥 Mentor", teacher: "🧑‍🏫 Teacher" };
  const RCOL = { student: "#0e7c8c", parent: "#7c3aed", guest: "#b45309", teacher: "#334155" };
  let f = "all";
  const render = () => {
    const rows = d.feed.filter(e => f === "all" ||
      (f === "students" && e.actor_role === "student") ||
      (f === "parents" && e.actor_role === "parent") ||
      (f === "mentors" && e.actor_role === "guest"));
    document.getElementById("act_rows").innerHTML = rows.map(e => {
      const c = RCOL[e.actor_role] || "#334155";
      return `<tr><td style="font-size:.78rem;white-space:nowrap">${fmtDateTime(e.at)}</td>
        <td><span class="pill" style="border:1px solid ${c};color:${c};margin-right:6px">${RNAME[e.actor_role] || esc(e.actor_role || "")}</span><b>${esc(e.actor || "—")}</b></td>
        <td style="font-size:1.15rem">${KICON[e.kind] || "•"}</td>
        <td style="font-size:.85rem">${e.kind === "login" ? "Logged in" : esc(e.text)}${e.points ? ` <b style="color:${e.points > 0 ? "#16a34a" : "#dc2626"}">${e.points > 0 ? "+" : ""}${e.points}</b>` : ""}</td></tr>`;
    }).join("") || `<tr><td colspan="4" class="muted">No activity yet.</td></tr>`;
    p.querySelectorAll("#act_filters button").forEach(b => b.classList.toggle("on", b.dataset.f === f));
  };
  p.innerHTML = `<h2>📊 Activity</h2>
    <p class="muted">Everything students, parents and mentors do — logins, submissions, points, task ticks. Tracking started when this update went live.</p>
    <div class="tabs" id="act_filters" style="margin-bottom:10px">
      <button data-f="all" class="on">All</button><button data-f="students">🧑‍🎓 Students</button><button data-f="parents">👪 Parents</button><button data-f="mentors">👥 Mentors</button>
    </div>
    <div class="card" style="padding:6px 14px;overflow-x:auto"><table>
    <thead><tr><th>When</th><th>Who</th><th></th><th>Activity</th></tr></thead>
    <tbody id="act_rows"></tbody></table></div>`;
  p.querySelectorAll("#act_filters button").forEach(b => b.onclick = () => { f = b.dataset.f; render(); });
  render();
}

async function vAccount(p) {
  const me = await api("GET", "/api/me");
  p.innerHTML = `<div class="card"><h2>👤 My Account</h2>
    <p class="muted">Your login for this app. Username is shown on the login screen.</p>
    <label>Username</label><input id="ac_user" value="${esc(me.username)}" style="max-width:280px">
    <label>New password</label><input id="ac_pw" type="text" placeholder="Leave blank to keep current" style="max-width:280px">
    <button class="btn" id="ac_go">Save changes</button></div>
  <div class="card"><h2>💾 Backup</h2>
    <p class="muted">Download a copy of all stories, points and accounts.</p>
    <a class="btn" href="/api/teacher/backup">Download backup</a></div>`;
  document.getElementById("ac_go").onclick = async () => {
    const body = {};
    const u = document.getElementById("ac_user").value.trim();
    const pw = document.getElementById("ac_pw").value;
    if (u) body.username = u;
    if (pw) body.password = pw;
    try { const r = await api("POST", "/api/teacher/profile", body); toast("Saved. Your username is now " + esc(r.username) + "."); }
    catch (e) { toast(e.message, false); }
  };
}

async function vBooks(p) {
  const d = await api("GET", "/api/books");
  p.innerHTML = `<div class="card"><h2>📚 Illustrated Books</h2>
    <p class="muted">Upload a book PDF (made from a boy's story). It appears in \u00a7 Books for all students.</p>
    <label>Title</label><input id="bk_title" style="max-width:320px">
    <label>Author name</label><input id="bk_author" style="max-width:320px">
    <label>Book PDF</label><input type="file" id="bk_file" accept="application/pdf">
    <button class="btn" id="bk_go">Upload book</button></div>
  <h2>Published books (${d.books.length})</h2>
  <div class="grid">${d.books.map(b => `
    <div class="card"><h3>${esc(b.title)}</h3><p class="muted">by ${esc(b.author_name)} · ${b.pages} pages</p>
    <a class="btn small" href="/api/books/${b.id}/file" target="_blank">Open</a>
    <button class="btn small danger" data-del="${b.id}">Delete</button></div>`).join("") || `<div class="card"><p class="muted">No books yet.</p></div>`}</div>`;
  document.getElementById("bk_go").onclick = async () => {
    const f = document.getElementById("bk_file").files[0];
    if (!f) return toast("Choose a PDF file.", false);
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(f);
    });
    try {
      await api("POST", "/api/teacher/books", { title: document.getElementById("bk_title").value,
        author_name: document.getElementById("bk_author").value, pdf_base64: b64 });
      toast("Book published!"); vBooks(p);
    } catch (e) { toast(e.message, false); }
  };
  p.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this book?")) return;
    await api("DELETE", "/api/teacher/books/" + b.dataset.del); toast("Deleted."); vBooks(p);
  });
}
