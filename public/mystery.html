<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mystery Room · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Hands">
</head>
<body><div id="nav"></div><div class="wrap">
<h1>🕵️ The Mystery Room</h1>
<p class="muted">Solve riddles, puzzles and detective cases. Each solved mystery earns points! 🔍</p>
<div id="list"></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Islamic Academy · S1 — 12th Batch</div>
</div>
<script>
(async () => {
  const user = await guard(); if (!user) return;
  document.getElementById("nav").innerHTML = user.role === "teacher" ? teacherNav("") : studentNav("mystery.html");
  async function load() {
    const d = await api("GET", "/api/mysteries");
    document.getElementById("list").innerHTML = d.mysteries.length ? d.mysteries.map(m => `
      <div class="card"><h3>${m.solved ? "✅ " : "🕵️ "}${esc(m.title)}</h3>
        <p>${esc(m.description)}</p>
        <p><span class="pill">+${m.points} pts</span></p>
        ${m.solved ? `<p class="muted">Solved! 🎉</p>` : user.role === "student" ? `
        <div class="grid" style="grid-template-columns:1fr auto;align-items:end">
          <div><label>Your answer</label><input id="ans${m.id}" placeholder="Who did it? Where is it?"></div>
          <div><button class="btn small" data-m="${m.id}">Solve 🔍</button></div>
        </div>` : ""}</div>`).join("")
      : `<div class="card"><p class="muted">No mysteries yet. The teacher will add some soon! 🔍</p></div>`;
    document.querySelectorAll("[data-m]").forEach(b => b.onclick = async () => {
      const id = b.dataset.m;
      try {
        const r = await api("POST", "/api/mystery/" + id + "/solve", { answer: document.getElementById("ans" + id).value });
        if (r.correct) { toast(`Correct! +${r.points || 0} points 🎉`); await load(); }
        else toast("Not quite — try again, detective! 🔍", false);
      } catch (e) { toast(e.message, false); }
    });
  }
  await load();
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body></html>
