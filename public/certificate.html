<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Winner Certificate · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">
<style>
@media print {
  @page { size: A4 portrait; margin: 0; }
  #nav, .no-print, .footer { display: none !important; }
  html, body { background: #fff; margin: 0; padding: 0; }
  .wrap { max-width: 100%; padding: 0; margin: 0; }
  .cert {
    box-shadow: none; margin: 0; width: 210mm; height: 297mm;
    max-height: none; page-break-inside: avoid; break-inside: avoid;
  }
}
.cert {
  background: #fff;
  border: 4px double #1e3a8a;
  border-radius: 4px;
  width: min(94vw, 780px);
  aspect-ratio: 210 / 297;
  margin: 20px auto;
  padding: 2.9em 2.5em;
  text-align: center;
  box-shadow: 0 4px 20px rgba(30,58,138,.12);
  position: relative;
  box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between;
  font-size: 16px;
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.cert::before {
  content: ""; position: absolute; inset: .6em;
  border: 2px solid #b45309; border-radius: 2px;
  pointer-events: none;
}
.cert .inst {
  font-size: .8em; font-weight: 700; letter-spacing: .16em;
  color: #1e3a8a; text-transform: uppercase;
}
.cert .congrats {
  font-family: Georgia, serif; font-size: 2.5em; color: #b45309;
  margin: .1em 0; font-weight: 700;
}
.cert .trophy { font-size: 3.4em; margin: 0; line-height: 1.15; }
.cert .cname {
  font-family: Georgia, serif; font-size: 1.95em; color: #1e3a8a;
  margin: .2em 0 .1em; font-weight: 700;
  border-bottom: 2px solid #e2e8f0; display: inline-block; padding: 0 .8em .25em;
}
.cert .rank-badge {
  display: inline-block; margin: .25em 0;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color: #fff; font-weight: 800; font-size: 1.2em;
  padding: .55em 1.9em; border-radius: 999px; letter-spacing: 1px;
}
.cert .rank-badge.gold { background: linear-gradient(135deg, #b45309, #f59e0b); }
.cert .rank-badge.silver { background: linear-gradient(135deg, #64748b, #94a3b8); }
.cert .rank-badge.bronze { background: linear-gradient(135deg, #9a3412, #ea580c); }
.cert .stats {
  display: flex; justify-content: center; gap: 1.6em; margin: .5em 0;
  flex-wrap: wrap;
}
.cert .stat { text-align: center; }
.cert .stat b { font-size: 1.55em; color: #1e3a8a; display: block; }
.cert .stat span { font-size: .75em; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
.cert .cmsg { color: #475569; font-size: 1em; margin: .4em auto; max-width: 30em; line-height: 1.7; }
.cert .programs {
  margin: .3em auto 0; max-width: 34em;
  font-size: .9em; color: #475569;
  background: #f8fafc;
  border: 1px dashed #94a3b8; border-radius: 8px;
  padding: .6em 1em; line-height: 1.8;
}
.cert .programs b { color: #1e3a8a; }
.cert .cdate { color: #64748b; font-size: .85em; margin-top: .3em; }
.cert .cfooter {
  margin-top: .6em; padding-top: .9em; border-top: 2px solid #1e3a8a;
  display: flex; justify-content: space-between; align-items: flex-end;
  text-align: left; font-size: .8em; color: #64748b;
}
.cert .cfooter .sig { text-align: center; }
.cert .cfooter .sigimg { height: 2.7em; display: block; margin: 0 auto; }
.cert .cfooter .sigline { border-top: 1px solid #94a3b8; padding-top: .25em; margin-top: .25em; min-width: 10em; }
.rank-select { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.rank-select button {
  border: 2px solid #e2e8f0; background: #fff; border-radius: 8px;
  padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: .95rem;
}
.rank-select button.on { border-color: #1e3a8a; background: #eff6ff; color: #1e3a8a; }
</style>
</head>
<body><div id="nav"></div><div class="wrap">
<div class="no-print" style="margin:16px 0;" id="controls">
  <h1>🏅 Winner Certificate</h1>
  <div id="teacherctl">
    <p class="muted">Select a rank, then print the certificate.</p>
    <div class="rank-select" id="ranks"></div>
  </div>
  <div id="studentctl" style="display:none">
    <p class="muted">This is your certificate. You can download or print it.</p>
  </div>
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
    <button class="btn" id="printbtn">🖨️ Print Certificate</button>
    <button class="btn ghost" id="dlbtn">⬇️ Download PDF</button>
    <button class="btn ghost" id="imgbtn">🖼️ Download Image</button>
    <a class="btn ghost" href="/top10.html" id="top10link">← Top 10 Poster</a>
  </div>
</div>
<div class="cert" id="cert"><p class="muted">Loading…</p></div>
<div class="footer no-print"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Islamic Academy · S1 — 12th Batch</div>
</div>
<script>
(async () => {
  const user = await guard(); if (!user) return;
  if (user.role === "parent") {
    document.getElementById("nav").innerHTML = `<div style="padding:10px 0"><a class="btn ghost" href="/parent.html">⬅️ Back to Parent Page</a></div>`;
  } else {
    document.getElementById("nav").innerHTML = user.role === "teacher" ? teacherNav("board.html") : studentNav("board.html");
  }
  const isTeacher = user.role === "teacher";
  const d = await api("GET", "/api/points-board?period=all");
  const board = d.board;
  const top10 = board.slice(0, 10);
  if (!top10.length) { document.getElementById("cert").innerHTML = "<p class='muted'>No ranked writers yet.</p>"; return; }
  const ordFull = n => n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th";
  const badgeCls = ["gold", "silver", "bronze"];
  const medals = ["🥇", "🥈", "🥉"];
  const labels = { story: "📖 Story", diary: "📔 Diary", letter: "✉️ Letter", poem: "🎭 Poem", manifesto: "📜 Manifesto", anything: "✨ Write Anything", review: "⭐ Book Review" };
  const rankBox = document.getElementById("ranks");

  let certName = "";
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  let libsPromise = null;
  function loadPdfLibs() {
    if (!libsPromise) {
      libsPromise = (async () => {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      })();
    }
    return libsPromise;
  }
  function fitCert() {
    const c = document.getElementById("cert");
    if (c && c.clientWidth) c.style.fontSize = Math.max(7, c.clientWidth / 48.75) + "px";
  }
  window.addEventListener("resize", fitCert);
  function showSaveOverlay(dataUrl) {
    let ov = document.getElementById("saveOverlay");
    if (!ov) {
      ov = document.createElement("div");
      ov.id = "saveOverlay";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(2,20,26,.9);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px";
      ov.innerHTML = `<div style="color:#fff;font-weight:700;text-align:center">📥 Your image is ready!<br><span style="font-weight:400;font-size:.85rem">Press &amp; hold the image, then tap “Save to Photos”</span></div><img id="saveOverlayImg" style="max-width:94vw;max-height:74vh;border-radius:8px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)"><button class="btn" id="saveOverlayClose">✖ Close</button>`;
      document.body.appendChild(ov);
      ov.querySelector("#saveOverlayClose").onclick = () => { ov.style.display = "none"; };
    }
    ov.querySelector("#saveOverlayImg").src = dataUrl;
    ov.style.display = "flex";
  }
  async function deliverFile(blob, filename) {
    // Best path (works on iPhone/iPad): upload to the app and open a real save page
    try {
      const res = await fetch("/api/save-file", { method: "POST", headers: { "Content-Type": blob.type || "application/octet-stream", "X-Filename": filename }, body: blob });
      const d = await res.json();
      if (d && d.url) { location.href = d.url; return; }
      throw new Error("no url");
    } catch (e) {
      const u = URL.createObjectURL(blob);
      const isAppleTouch = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      if (isAppleTouch) { showSaveOverlay(u); return; }
      const a = document.createElement("a");
      a.download = filename; a.href = u; a.click();
      setTimeout(() => URL.revokeObjectURL(u), 30000);
    }
  }
  async function captureCert() {
    await loadPdfLibs();
    const el = document.getElementById("cert");
    const sc = Math.min(4, Math.max(2, Math.ceil(2480 / el.offsetWidth)));
    return html2canvas(el, { scale: sc, backgroundColor: "#ffffff", useCORS: true });
  }
  function certFileBase() {
    return "Certificate-" + (certName || "Winner").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-");
  }
  async function withBusy(btn, fn) {
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "⏳ Preparing…";
    try { await fn(); } catch (e) { window.print(); }
    btn.disabled = false; btn.textContent = old;
  }
  document.getElementById("printbtn").onclick = () => window.print();
  document.getElementById("dlbtn").onclick = (e) => withBusy(e.currentTarget, async () => {
    const src = await captureCert();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
    // The certificate design is itself a full A4 page — fill the whole PDF page with it
    pdf.addImage(src.toDataURL("image/jpeg", 0.98), "JPEG", 0, 0, 210, 297);
    await deliverFile(pdf.output("blob"), certFileBase() + ".pdf");
  });
  document.getElementById("imgbtn").onclick = (e) => withBusy(e.currentTarget, async () => {
    const src = await captureCert();
    // Exact A4 image (2480 x 3508 px = A4 at 300 dpi), design filling the whole page
    const out = document.createElement("canvas");
    out.width = 2480; out.height = 3508;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 2480, 3508);
    ctx.drawImage(src, 0, 0, 2480, 3508);
    const blob = await new Promise(r => out.toBlob(r, "image/png"));
    await deliverFile(blob, certFileBase() + ".png");
  });

  function showCert(r, rankIdx) {
    certName = r.display_name;
    document.getElementById("cert").innerHTML = `
      <div class="inst">Noorul Huda Centre for Excellence</div>
      <div class="trophy">${medals[rankIdx] || "🏅"}</div>
      <div class="congrats">Congratulations!</div>
      <div class="cname">${esc(r.display_name)}</div>
      <div><span class="rank-badge ${badgeCls[rankIdx] || ""}">${ordFull(rankIdx + 1)} Position</span></div>
      <div class="cmsg">For outstanding creativity and dedication in <b>Little Hands, Big Stories</b> — the young writers' platform of Noorul Huda Islamic Academy, S1 — 12th Batch.</div>
      <div class="programs" id="cert_programs">Loading programs…</div>
      <div class="stats">
        <div class="stat"><b>${r.points}</b><span>Points</span></div>
        <div class="stat"><b>${r.works}</b><span>Works</span></div>
        <div class="stat"><b>${r.stars}⭐</b><span>Stars</span></div>
      </div>
      <div class="cdate">${new Date().toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })}</div>
      <div class="cfooter">
        <div><b>Little Hands, Big Stories</b><br>12th Batch of NHCE</div>
        <div class="sig"><img class="sigimg" src="/signature.png" alt="Teacher's signature"><div class="sigline">Teacher's Signature</div></div>
      </div>`;
    fitCert();
    api("GET", `/api/author/${r.id}`).then(a => {
      const box = document.getElementById("cert_programs");
      if (!box) return;
      const counts = {};
      (a.works || []).forEach(w => { counts[w.type] = (counts[w.type] || 0) + 1; });
      const parts = Object.entries(counts).map(([t, c]) => `<b>${labels[t] || t}</b> × ${c}`);
      box.innerHTML = parts.length ? `📚 Programs: ${parts.join(" &nbsp;·&nbsp; ")}` : "";
    }).catch(() => {});
  }

  if (isTeacher) {
    // Teacher: full access — pick any rank, print any certificate
    rankBox.innerHTML = top10.map((r, i) =>
      `<button data-i="${i}" class="${i === 0 ? "on" : ""}">${medals[i] || ""} ${ordFull(i + 1)} — ${esc(r.display_name.split(" ")[0])}</button>`).join("");
    const show = i => {
      rankBox.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === i));
      showCert(top10[i], i);
    };
    rankBox.querySelectorAll("button").forEach(b => b.onclick = () => show(+b.dataset.i));
    show(0);
  } else if (user.role === "parent") {
    // Parent: only their own child's certificate
    document.getElementById("teacherctl").style.display = "none";
    document.getElementById("studentctl").style.display = "";
    document.querySelector("#studentctl .muted").textContent = "This is your child's certificate. You can download or print it.";
    document.getElementById("top10link").style.display = "none";
    const cd = await api("GET", "/api/parent/child");
    const myIdx = board.findIndex(r => r.id === cd.student.id);
    if (myIdx < 0) {
      document.getElementById("cert").innerHTML = "<p class='muted'>Your child doesn't have any points yet. The certificate will appear here once they start earning points! ✍️</p>";
      document.getElementById("printbtn").style.display = "none";
      document.getElementById("dlbtn").style.display = "none";
      document.getElementById("imgbtn").style.display = "none";
      return;
    }
    showCert(board[myIdx], myIdx);
  } else {
    // Student: only their own certificate
    document.getElementById("teacherctl").style.display = "none";
    document.getElementById("studentctl").style.display = "";
    document.getElementById("top10link").style.display = "none";
    const myIdx = board.findIndex(r => r.id === user.id);
    if (myIdx < 0) {
      document.getElementById("cert").innerHTML = "<p class='muted'>You don't have any points yet. Keep writing to earn your certificate! ✍️</p>";
      document.getElementById("printbtn").style.display = "none";
      document.getElementById("dlbtn").style.display = "none";
      document.getElementById("imgbtn").style.display = "none";
      return;
    }
    showCert(board[myIdx], myIdx);
  }
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body></html>
