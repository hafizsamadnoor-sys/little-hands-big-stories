<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authors · Little Hands, Big Stories</title>
<link rel="stylesheet" href="/style.css"><script src="/app.js"></script><link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="/icons/flower-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Hands">
</head>
<body><div id="nav"></div><div class="wrap">
<h1>👥 Young Authors</h1>
<p class="muted">The 38 writers of S1 — 12th Batch, Noorul Huda Islamic Academy.</p>
<div id="list" class="grid names"></div>
<div class="footer"><div class="finst">NOORUL HUDA CENTRE FOR EXCELLENCE</div>Little Hands, Big Stories · Noorul Huda Islamic Academy · S1 — 12th Batch</div>
</div>
<script>
(async () => {
  const user = await guard(); if (!user) return;
  document.getElementById("nav").innerHTML = user.role === "teacher" ? teacherNav("authors.html") : studentNav("authors.html");
  const d = await api("GET", "/api/authors");
  document.getElementById("list").innerHTML = d.authors.map(a =>
    `<a href="/author.html?id=${a.id}" style="text-decoration:none;color:inherit"><div class="namecard">
      <div class="avatar">${avatar(a.display_name, a.photo)}</div>
      <div>${esc(a.display_name)}</div>
      <div class="muted" style="font-size:.78rem">${a.points} pts · ${a.works} works</div>
    </div></a>`).join("");
})();
</script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script>
</body></html>
